  <div id="__bundler_placeholder">Loading Breakfast Buddy...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);

02Fdiv>\n\n<sc-if value=\"{{ sheetOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bb-sheet-title\" style=\"position: fixed; inset: 0; z-index: 50; background: rgba(20, 28, 22, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box\">\n<div style=\"width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 20px; box-sizing: border-box; display: flex; flex-direction: column\">\n<div style=\"padding: 20px 20px 16px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line)\">\n<div style=\"flex: 1 1 auto; min-width: 0\">\n<p style=\"margin: 0 0 4px; font-size: 13px; font-weight: 700; color: var(--turmeric-ink); text-transform: uppercase; letter-spacing: 0.06em\">Recipe<\u002Fp>\n<h2 id=\"bb-sheet-title\" style=\"margin: 0; font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; line-height: 1.1\">{{ sheet.name }}<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px\">\n<span style=\"padding: 4px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600\">{{ sheet.time }} min<\u002Fspan>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600\">{{ sheet.dietLabel }}<\u002Fspan>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: var(--bg); font-size: 13px; font-weight: 600\">Serves {{ sheet.serves }}<\u002Fspan>\n<span style=\"padding: 4px 10px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf-ink); font-size: 13px; font-weight: 600\">{{ sheet.haveText }} key items in kitchen<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeSheet }}\" aria-label=\"Close recipe\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; border: 1.5px solid var(--line-strong); backgrou 5px solid var(--line-strong); font-size: 15px; font-family: inherit; color: var(--ink); background: var(--bg)\">\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ sheet.cook }}\" style=\"flex: 1 1 180px; min-height: 48px; border-radius: 999px; border: none; background: var(--leaf); color: var(--card); font-weight: 700; font-size: 15px; cursor: pointer\">{{ sheet.cookLabel }}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ sheet.copy }}\" style=\"flex: 1 1 180px; min-height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer\">{{ sheet.copyLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between\">\n<a href=\"{{ sheet.waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 14px\">Open in WhatsApp<\u002Fa>\n<button type=\"button\" sc-camel-on-click=\"{{ sheet.skip }}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--card); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer\">Not today<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1700}}\">\nconst GROUPS = [\n  { id: 'vegetables', label: 'Vegetables' },\n  { id: 'grains', label: 'Grains & flours' },\n  { id: 'dairy', label: 'Dairy' },\n  { id: 'protein', label: 'Protein' }\n];\nconst ING = [\n  { id: 'onion', g: 'vegetables', label: 'Onion', alias: ['onion', 'kanda', 'pyaz', 'pyaaz'] },\n  { id: 'potato', g: 'vegetables', label: 'Potato', alias: ['potato', 'aloo', 'batata'] },\n  { id: 'carrot', g: 'vegetables', label: 'Carrot', alias: ['carrot', 'gajar'] },\n  { id: 'tomato', g: 'vegetables', label: 'Tomato', alias: ['tomato', 'tamatar'] },\n  { id: 'chilli', g: 'vegetables', label: 'Green chilli', alias: ['chilli', 'chili', 'mirchi'] },\n  { id: 'methi', g: 'vegetables', label: 'Methi', alias: ['methi', 'fenugreek'] },\n  { id: 'veg', g: 'vegetables', label: 'Peas / capsicum / beans', alias: ['veg', 'veggies', 'vegetable', 'peas', 'beans', 'capsicum', 'cabbage', 'cucumber'] },\n  { id: 'coconut', g: 'vegetables', label: 'Coconut', alias: ['coconut', 'nariyal'] },\n  { id: 'poha', g: 'grains', label: 'Poha', alias: ['poha', 'aval', 'chivda'] },\n  { id: 'rava', g: 'grains', label: 'Rava / Sooji', alias: ['rava', 'sooji', 'suji', 'semolina'] },\n  { id: 'besan', g: 'grains', label: 'Besan', alias: ['besan', 'gram flour', 'chickpea flour'] },\n  { id: 'atta', g: 'grains', label: 'Atta', alias: ['atta', 'wheat flour', 'whole wheat'] },\n  { id: 'bread', g: 'grains', label: 'Bread / Pav', alias: ['bread', 'pav', 'bun'] },\n  { id: 'oats', g: 'grains', label: 'Oats', alias: ['oats', 'oat'] },\n  { id: 'batter', g: 'grains', label: 'Idli / Dosa batter', alias: ['batter', 'idli', 'dosa'] },\n  { id: 'rice', g: 'grains', label: 'Rice / Rice flour', alias: ['rice', 'chawal'] },\n  { id: 'ragi', g: 'grains', label: 'Ragi flour', alias: ['ragi', 'nachni', 'finger millet'] },\n  { id: 'vermicelli', g: 'grains', label: 'Vermicelli', alias: ['vermicelli', 'semiya', 'sevai', 'seviyan'] },\n  { id: 'sabudana', g: 'grains', label: 'Sabudana', alias: ['sabudana', 'sago', 'tapioca pearl'] },\n  { id: 'paneer', g: 'dairy', label: 'Paneer', alias: ['paneer', 'cottage cheese'] },\n  { id: 'curd', g: 'dairy', label: 'Curd', alias: ['curd', 'dahi', 'yogurt', 'yoghurt'] },\n  { id: 'milk', g: 'dairy', label: 'Milk', alias: ['milk', 'doodh'] },\n  { id: 'cheese', g: 'dairy', label: 'Cheese', alias: ['cheese'] },\n  { id: 'eggs', g: 'protein', label: 'Eggs', alias: ['egg', 'anda'] },\n  { id: 'chicken', g: 'protein', label: 'Chicken', alias: ['chicken', 'murgh'] },\n  { id: 'mutton', g: 'protein', label: 'Mutton keema', alias: ['mutton', 'keema', 'lamb', 'goat'] },\n  { id: 'moong', g: 'protein', label: 'Moong dal', alias: ['moong', 'mung'] },\n  { id: 'peanuts', g: 'protein', label: 'Peanuts', alias: ['peanut', 'groundnut', 'moongphali', 'shengdana'] }\n];\nconst LABEL = {};\nING.forEach((i) => { LABEL[i.id] = i.label.toLowerCase(); });\nconst ROOTS = ['onion', 'potato', 'carrot', 'ginger', 'garlic'];\nconst FORBID = {\n  jain: ['onion', 'potato', 'carrot', 'eggs', 'chicken', 'mutton'],\n  veg: ['eggs', 'chicken', 'mutton'],\n  egg: ['chicken', 'mutton'],\n  nonveg: []\n};\nfunction listNice(arr) {\n  if (arr.length <= 1) return arr.join('');\n  return arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];\n}\n\n// ---- Saved in this browser only (per viewer); everything still works if storage is blocked ----\nconst STORE_KEY = 'breakfast-buddy-v1';\nconst DAY_MS = 24 * 60 * 60 * 1000;\nconst VISIT_GAP_MS = 30 * 60 * 1000; // reopening within 30 min counts as the same visit\nconst SAMPLE = ['poha', 'rava', 'besan', 'bread', 'onion', 'tomato', 'chilli', 'peanuts', 'curd', 'milk'];\nfunction loadSaved() {\n  try { const raw = window.localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }\n}\nfunction writeSaved(obj) {\n  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }\n}\nfunction daysAgo(at) {\n  const a = new Date(at); a.setHours(0, 0, 0, 0);\n  const b = new Date(); b.setHours(0, 0, 0, 0);\n  return Math.round((b - a) / DAY_MS);\n}\nfunction whenText(days) {\n  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';\n}\nfunction freshStats() {\n  return { visits: 1, cookedVisits: 0, cooked: 0, skipped: 0, lastCookedVisit: null };\n}\n\n// d: veg | egg | nonveg. roots: no (Jain-friendly), adapt (Jain version possible), yes (needs potato/onion)\n// r: recipe. ing rows are [ingredient id or 0 for pantry staple, text]\nconst DISHES = [\n  { n: 'Kanda Poha', desc: 'Maharashtrian flattened rice with peanuts and lemon', t: 15, d: 'veg', roots: 'adapt', core: ['poha'], opt: ['onion', 'peanuts', 'chilli', 'potato'], tags: ['quick', 'healthy'], tip: 'Skip onion and potato; add peas or grated raw banana for bulk.',\n    r: { serves: 2, ing: [['poha', '1½ cups thick poha'], ['onion', '1 medium onion, chopped'], ['potato', '1 small potato, diced (optional)'], ['peanuts', '2 tbsp peanuts'], ['chilli', '1–2 green chillies, slit'], [0, '1 tsp mustard seeds, curry leaves'], [0, '¼ tsp turmeric, salt, a pinch of sugar'], [0, 'Lemon and coriander to finish'], [0, '1½ tbsp oil']],\n      steps: ['Rinse the poha in a sieve under running water, drain, and leave it for 5 minutes to soften.', 'Fry the peanuts in oil until crunchy and set aside.', 'In the same oil, add mustard seeds, curry leaves and chilli, then the onion (and potato) and cook until soft.', 'Add turmeric, salt and sugar, then the poha. Toss gently on low heat for 2–3 minutes.', 'Finish with peanuts, a squeeze of lemon and coriander.'],\n      tip: \"Don't soak poha in a bowl. A quick rinse in a sieve keeps it fluffy instead of mushy.\" } },\n  { n: 'Rava Upma', desc: 'South Indian roasted semolina with mustard and curry leaves', t: 20, d: 'veg', roots: 'adapt', core: ['rava'], opt: ['onion', 'veg', 'chilli', 'peanuts'], tags: ['quick'], tip: 'Use capsicum, peas and tomato instead of onion.',\n    r: { serves: 2, ing: [['rava', '1 cup rava'], ['onion', '1 onion, chopped'], ['veg', '½ cup mixed veggies'], ['chilli', '1 green chilli'], ['peanuts', '1 tbsp peanuts or cashews (optional)'], ['ginger', '1 tsp grated ginger'], [0, '1 tsp mustard seeds, 1 tsp urad dal, curry leaves'], [0, '2½ cups water, salt'], [0, '1 tbsp ghee or oil']],\n      steps: ['Dry-roast the rava on low heat until it smells nutty, about 4–5 minutes. Set aside.', 'Heat ghee, then add mustard seeds, urad dal, curry leaves, chilli and ginger.', 'Sauté the onion and veggies for 3 minutes.', 'Add water and salt and bring to a rolling boil.', 'Pour in the rava slowly while stirring, then cover and cook on low for 2 minutes.'],\n      tip: 'Roasting the rava is what stops lumps. Roast a big batch on Sunday and store it for the week.' } },\n  { n: 'Besan Chilla', desc: 'Savoury gram-flour pancakes, ready in one pan', t: 15, d: 'veg', roots: 'adapt', core: ['besan'], opt: ['tomato', 'onion', 'chilli', 'methi'], tags: ['quick', 'healthy'], tip: 'Make it with tomato, capsicum and coriander only.',\n    r: { serves: 2, ing: [['besan', '1 cup besan'], ['tomato', '1 tomato, finely chopped'], ['onion', '½ onion, finely chopped'], ['chilli', '1 green chilli'], ['methi', 'Handful of methi leaves (optional)'], [0, '¼ tsp turmeric, ½ tsp ajwain, salt'], [0, 'About ¾ cup water'], [0, 'Oil for the pan']],\n      steps: ['Whisk the besan, spices, salt and water into a smooth, pourable batter.', 'Stir in the tomato, onion, chilli and coriander.', 'Heat a greased tawa, pour a ladle of batter and spread it thin.', 'Cook for about 2 minutes per side with a little oil, until golden spots appear.'],\n      tip: 'Rest the batter for 5 minutes. Chillas spread more easily and won’t tear.' } },\n  { n: 'Idli with Coconut Chutney', desc: 'Steamed rice-lentil cakes, light on the stomach', t: 20, d: 'veg', roots: 'no', core: ['batter'], opt: ['coconut', 'chilli'], tags: ['healthy'], tip: '',\n    r: { serves: 3, ing: [['batter', '3 cups idli batter'], ['coconut', '½ cup grated coconut'], ['chilli', '1 green chilli'], [0, '2 tbsp roasted chana dal, salt'], [0, 'Mustard seeds and curry leaves to temper'], [0, 'Oil for greasing']],\n      steps: ['Grease the idli plates and fill each mould about three-quarters full.', 'Steam in an idli cooker, or a pressure cooker without the whistle, for 10–12 minutes.', 'Meanwhile grind the coconut, chana dal, chilli and salt with a little water.', 'Temper the chutney with mustard seeds and curry leaves.', 'Rest the idlis for 2 minutes, then unmould with a wet spoon.'],\n      tip: 'Poke an idli with a toothpick. If it comes out clean, they’re done.' } },\n  { n: 'Plain Dosa', desc: 'Crisp dosa with chutney or sambar', t: 15, d: 'veg', roots: 'no', core: ['batter'], opt: ['coconut'], tags: ['quick'], tip: '',\n    r: { serves: 2, ing: [['batter', '2 cups dosa batter'], ['coconut', 'Coconut chutney to serve (optional)'], [0, 'Oil or ghee'], [0, 'Salt, if the batter is unsalted']],\n      steps: ['Heat a tawa well, then wipe it with an oiled cloth.', 'Pour a ladle of batter in the centre and spread it outward in circles, as thin as you can.', 'Drizzle oil around the edges.', 'Cook until golden and crisp, about 2 minutes. No need to flip.', 'Fold and serve with chutney or sambar.'],\n      tip: 'Sprinkle a few drops of water on the tawa. If they sizzle away instantly, it’s hot enough.' } },\n  { n: 'Onion Tomato Uttapam', desc: 'Thick dosa topped with veggies', t: 20, d: 'veg', roots: 'adapt', core: ['batter'], opt: ['onion', 'tomato', 'carrot', 'veg', 'chilli'], tags: ['new'], tip: 'Top with tomato, capsicum and coriander instead of onion.',\n    r: { serves: 2, ing: [['batter', '2 cups dosa batter'], ['onion', '1 onion, finely chopped'], ['tomato', '1 tomato, finely chopped'], ['carrot', '1 small carrot, grated'], ['veg', 'Capsicum, finely chopped'], ['chilli', '1 green chilli'], [0, 'Coriander, salt, oil']],\n      steps: ['Spread a ladle of batter on a hot tawa, keeping it thick (about ½ cm).', 'Scatter the toppings over it and press them in lightly.', 'Drizzle oil, cover and cook on medium for 3 minutes.', 'Flip and cook 1 more minute.'],\n      tip: 'Slightly sour, older batter makes the best uttapam, so it’s a great use for the end of a batch.' } },\n  { n: 'Masala Dosa', desc: 'Crisp dosa stuffed with spiced potato bhaji', t: 35, d: 'veg', roots: 'yes', core: ['batter', 'potato'], opt: ['onion', 'chilli'], tags: [], tip: '',\n    r: { serves: 2, ing: [['batter', '2 cups dosa batter'], ['potato', '3 potatoes, boiled'], ['onion', '1 onion, sliced'], ['chilli', '2 green chillies'], ['ginger', '1 tsp grated ginger'], [0, 'Mustard seeds, curry leaves, ¼ tsp turmeric'], [0, 'Salt and oil']],\n      steps: ['Roughly mash the boiled potatoes.', 'Temper mustard seeds, curry leaves, chilli and ginger, then sauté the onion until soft.', 'Add turmeric, salt, the potatoes and a splash of water. Mix for 2 minutes.', 'Make thin, crisp dosas.', 'Spoon the bhaji into the centre, fold and serve.'],\n      tip: 'Boil the potatoes the night before and you’ll halve the morning work.' } },\n  { n: 'Masala Omelette', desc: 'Fluffy eggs with onion, tomato and chilli', t: 10, d: 'egg', roots: 'no', core: ['eggs'], opt: ['onion', 'tomato', 'chilli', 'bread'], tags: ['quick'], tip: '',\n    r: { serves: 1, ing: [['eggs', '2–3 eggs'], ['onion', '½ onion, chopped'], ['tomato', '½ tomato, chopped'], ['chilli', '1 green chilli'], ['bread', 'Bread to serve'], [0, 'Salt, pepper, pinch of turmeric, coriander'], [0, 'Butter or oil']],\n      steps: ['Whisk the eggs with salt, pepper and turmeric until frothy.', 'Mix in the onion, tomato, chilli and coriander.', 'Heat butter in a pan, pour in the eggs and swirl.', 'Cook on medium for 2 minutes, then flip or fold and cook 1 minute more.', 'Serve with toast.'],\n      tip: 'A spoon of milk or water whisked in makes it noticeably fluffier.' } },\n  { n: 'Egg Bhurji Pav', desc: 'Spicy scrambled eggs with toasted pav', t: 15, d: 'egg', roots: 'no', core: ['eggs', 'bread'], opt: ['onion', 'tomato', 'chilli'], tags: ['quick'], tip: '',\n    r: { serves: 2, ing: [['eggs', '4 eggs'], ['bread', '4 pav or bread slices'], ['onion', '1 onion, chopped'], ['tomato', '1 tomato, chopped'], ['chilli', '1–2 green chillies'], [0, '½ tsp pav bhaji masala or garam masala, ¼ tsp turmeric'], [0, 'Butter, salt, coriander']],\n      steps: ['Sauté the onion and chilli in butter until soft.', 'Add tomato, turmeric, masala and salt; cook until mushy.', 'Crack in the eggs and scramble on low heat until just set.', 'Toast the pav in butter.', 'Top the bhurji with coriander and serve.'],\n      tip: 'Take it off the heat while still slightly wet. The eggs keep cooking on the plate.' } },\n  { n: 'Parsi Akuri', desc: 'Soft, spiced Parsi scrambled eggs on toast', t: 15, d: 'egg', roots: 'no', core: ['eggs'], opt: ['onion', 'tomato', 'chilli', 'bread', 'milk'], tags: ['new', 'quick'], tip: '',\n    r: { serves: 2, ing: [['eggs', '3 eggs'], ['milk', '2 tbsp milk'], ['onion', '1 small onion, chopped'], ['tomato', '1 tomato, chopped'], ['chilli', '1 green chilli'], ['bread', 'Buttered toast to serve'], [0, '¼ tsp turmeric, ¼ tsp red chilli powder'], [0, 'Butter, salt, coriander']],\n      steps: ['Whisk the eggs with milk and salt.', 'Soften the onion and chilli in butter, then add tomato and spices for 2 minutes.', 'Turn the heat to its lowest and pour in the eggs, stirring slowly.', 'Stop while they’re creamy and soft.', 'Pile onto buttered toast and top with coriander.'],\n      tip: 'Akuri should be creamier than bhurji: lowest heat, and keep it moving.' } },\n  { n: 'Aloo Paratha', desc: 'Stuffed potato flatbread with curd and pickle', t: 40, d: 'veg', roots: 'yes', core: ['atta', 'potato'], opt: ['curd', 'onion', 'chilli'], tags: [], tip: '',\n    r: { serves: 3, ing: [['atta', '2 cups atta'], ['potato', '3 potatoes, boiled and cooled'], ['onion', '½ onion, finely chopped (optional)'], ['chilli', '1–2 green chillies'], ['curd', 'Curd to serve'], [0, '½ tsp ajwain, ½ tsp amchur or garam masala'], [0, 'Coriander, salt, ghee']],\n      steps: ['Knead the atta into a soft dough with water and a pinch of salt. Rest for 10 minutes.', 'Mash the potatoes with chilli, spices, coriander and salt.', 'Roll out a small disc, place stuffing in the centre, seal and roll gently.', 'Cook on a hot tawa with ghee until golden on both sides.', 'Serve with curd and pickle.'],\n      tip: 'Cool the potatoes fully and keep the stuffing dry. Wet filling is what tears parathas.' } },\n  { n: 'Paneer Paratha', desc: 'Protein-rich paratha stuffed with spiced paneer', t: 35, d: 'veg', roots: 'adapt', core: ['atta', 'paneer'], opt: ['curd', 'chilli'], tags: [], tip: 'Keep the stuffing to paneer, chilli, coriander and spices.',\n    r: { serves: 3, ing: [['atta', '2 cups atta'], ['paneer', '200 g paneer, grated'], ['chilli', '1 green chilli, minced'], ['curd', 'Curd to serve'], [0, '½ tsp ajwain, ½ tsp garam masala'], [0, 'Coriander, salt, ghee']],\n      steps: ['Knead a soft dough with atta, water and salt. Rest for 10 minutes.', 'Mix the paneer with chilli, spices and coriander.', 'Add salt to the stuffing just before rolling.', 'Stuff, seal and roll out gently.', 'Cook on a hot tawa with ghee until golden on both sides.'],\n      tip: 'Salt the paneer at the last moment, otherwise it releases water and the paratha splits.' } },\n  { n: 'Methi Thepla', desc: 'Gujarati fenugreek flatbread, great with curd', t: 35, d: 'veg', roots: 'no', core: ['atta', 'methi'], opt: ['curd', 'besan'], tags: ['healthy', 'new'], tip: '',\n    r: { serves: 3, ing: [['atta', '2 cups atta'], ['methi', '1 cup methi leaves, chopped'], ['curd', '¼ cup curd'], ['besan', '2 tbsp besan'], [0, '¼ tsp turmeric, ½ tsp chilli powder, ½ tsp ajwain, 1 tsp sesame'], [0, 'Salt and oil']],\n      steps: ['Mix the atta, besan, methi, spices and curd.', 'Knead into a soft dough with a little water. Rest for 10 minutes.', 'Roll out thin.', 'Cook on a tawa with a little oil on both sides.', 'Serve with curd or pickle.'],\n      tip: 'Theplas keep for 2–3 days. Make extra and tomorrow’s tiffin is sorted.' } },\n  { n: 'Masala Oats', desc: 'Savoury oats cooked with veggies and spices', t: 10, d: 'veg', roots: 'adapt', core: ['oats'], opt: ['veg', 'tomato', 'onion'], tags: ['quick', 'healthy'], tip: 'Use tomato, capsicum and peas; skip onion and carrot.',\n    r: { serves: 2, ing: [['oats', '1 cup rolled oats'], ['veg', '½ cup mixed veggies'], ['tomato', '1 tomato, chopped'], ['onion', '½ onion, chopped'], [0, 'Mustard seeds, ¼ tsp turmeric, ½ tsp sambar powder or garam masala'], [0, '2 cups water, salt, 1 tsp oil']],\n      steps: ['Temper mustard seeds in oil, then sauté the onion and veggies.', 'Add tomato and spices and cook for 2 minutes.', 'Add the oats and toast them for 1 minute.', 'Add water and salt and simmer for 3–4 minutes until creamy.'],\n      tip: 'Rolled oats hold their texture far better than instant oats here.' } },\n  { n: 'Oats Porridge with Fruit', desc: 'Warm milk oats with banana and nuts', t: 10, d: 'veg', roots: 'no', core: ['oats', 'milk'], opt: [], tags: ['quick', 'healthy'], tip: '',\n    r: { serves: 1, ing: [['oats', '½ cup oats'], ['milk', '1½ cups milk'], [0, '1 banana'], [0, 'Jaggery or honey, a pinch of cardamom'], [0, 'A few nuts']],\n      steps: ['Simmer the oats in milk for 4–5 minutes, stirring.', 'Turn off the heat, then stir in jaggery and cardamom.', 'Top with sliced banana and nuts.'],\n      tip: 'Add jaggery off the heat so the milk doesn’t split.' } },\n  { n: 'Bombay Veg Sandwich', desc: 'Green chutney sandwich with cucumber and tomato', t: 10, d: 'veg', roots: 'adapt', core: ['bread'], opt: ['tomato', 'veg', 'cheese', 'potato'], tags: ['quick'], tip: 'Use cucumber, tomato and capsicum; leave out potato and onion.',\n    r: { serves: 2, ing: [['bread', '4 bread slices'], ['tomato', '1 tomato, sliced'], ['veg', 'Cucumber and capsicum, sliced'], ['cheese', 'Cheese slice (optional)'], ['potato', '1 boiled potato, sliced (optional)'], [0, 'Green chutney, butter, chaat masala']],\n      steps: ['Butter the bread and spread green chutney.', 'Layer potato, cucumber, tomato and capsicum.', 'Sprinkle chaat masala and add cheese.', 'Close and toast or grill for 3 minutes.'],\n      tip: 'No green chutney? Blend coriander, mint, chilli, lemon and salt. It takes one minute.' } },\n  { n: 'Bread Upma', desc: 'Leftover bread tossed with onion, tomato and spices', t: 15, d: 'veg', roots: 'adapt', core: ['bread'], opt: ['onion', 'tomato', 'chilli'], tags: ['new', 'quick'], tip: 'Make it with tomato and capsicum only.',\n    r: { serves: 2, ing: [['bread', '5 bread slices, cubed'], ['onion', '1 onion, chopped'], ['tomato', '1 tomato, chopped'], ['chilli', '1 green chilli'], [0, 'Mustard seeds, curry leaves, ¼ tsp turmeric'], [0, 'Salt, lemon, coriander, oil']],\n      steps: ['Cube the bread. Slightly stale bread works best.', 'Temper mustard seeds, curry leaves and chilli, then sauté the onion.', 'Add tomato, turmeric and salt and cook until soft.', 'Toss in the bread for 2 minutes.', 'Finish with lemon and coriander.'],\n      tip: 'If it looks dry, sprinkle a few spoons of water while tossing.' } },\n  { n: 'Rava Dosa', desc: 'Lacy, instant semolina dosa, no fermentation needed', t: 25, d: 'veg', roots: 'adapt', core: ['rava', 'rice'], opt: ['onion', 'chilli', 'curd'], tags: ['new'], tip: 'Skip onion; add cumin and black pepper.',\n    r: { serves: 2, ing: [['rava', '½ cup rava'], ['rice', '½ cup rice flour'], ['onion', '1 onion, finely chopped'], ['chilli', '1 green chilli'], ['curd', '2 tbsp curd'], [0, '2 tbsp maida, 1 tsp cumin, crushed pepper, curry leaves'], [0, 'About 2 cups water, salt, oil']],\n      steps: ['Mix the rava, rice flour, maida, curd and salt with water into a thin, watery batter. Rest for 15 minutes.', 'Stir in the onion, chilli, cumin and pepper.', 'Heat the tawa until very hot and pour the batter from a height so it forms lacy holes.', 'Drizzle oil and cook until crisp. Don’t flip.'],\n      tip: 'Stir the batter before every dosa, because the rava sinks to the bottom.' } },\n  { n: 'Rava Idli', desc: 'Instant semolina idli with curd', t: 30, d: 'veg', roots: 'no', core: ['rava', 'curd'], opt: ['veg', 'chilli'], tags: ['new', 'healthy'], tip: '',\n    r: { serves: 3, ing: [['rava', '1 cup rava'], ['curd', '1 cup curd'], ['veg', 'Grated carrot or peas'], ['chilli', '1 green chilli'], [0, '½ tsp Eno or baking soda'], [0, 'Mustard seeds, chana dal, curry leaves, cashews'], [0, 'Salt and ghee']],\n      steps: ['Roast the rava in ghee with mustard seeds, chana dal and curry leaves. Let it cool.', 'Mix in the curd, salt, veggies and chilli. Rest for 15 minutes.', 'Add Eno, stir quickly and fill greased moulds.', 'Steam for 12 minutes.'],\n      tip: 'Add Eno only right before steaming, or the idlis won’t rise.' } },\n  { n: 'Moong Dal Chilla', desc: 'Protein-packed lentil crepes, paneer optional', t: 30, d: 'veg', roots: 'adapt', core: ['moong'], opt: ['paneer', 'chilli', 'tomato'], tags: ['healthy', 'new'], tip: 'Green chilli, cumin and coriander give it plenty of flavour.',\n    r: { serves: 2, ing: [['moong', '1 cup moong dal, soaked 2–4 hours'], ['paneer', '½ cup paneer, grated (optional)'], ['chilli', '1 green chilli'], ['tomato', '1 tomato, chopped'], ['ginger', '1 tsp ginger'], [0, '½ tsp cumin, salt, coriander, oil']],\n      steps: ['Grind the soaked dal with chilli, ginger and a little water into a smooth batter.', 'Stir in cumin and salt.', 'Spread thin on a hot tawa and cook on both sides.', 'Fill with paneer and tomato, then fold.'],\n      tip: 'Soak the dal the night before. That’s the only real work in this recipe.' } },\n  { n: 'Instant Ragi Dosa', desc: 'Finger-millet dosa, high in fibre and calcium', t: 20, d: 'veg', roots: 'adapt', core: ['ragi'], opt: ['curd', 'rice', 'onion', 'chilli'], tags: ['healthy', 'new'], tip: 'Skip onion; the dosa works fine without it.',\n    r: { serves: 2, ing: [['ragi', '1 cup ragi flour'], ['rice', '¼ cup rice flour'], ['curd', '¼ cup curd'], ['onion', '1 onion, chopped'], ['chilli', '1 green chilli'], [0, 'Cumin, curry leaves, salt'], [0, 'About 2 cups water, oil']],\n      steps: ['Whisk everything except onion and chilli into a thin batter. Rest for 10 minutes.', 'Stir in the onion and chilli.', 'Pour onto a hot tawa from the outside in.', 'Drizzle oil and cook until crisp.'],\n      tip: 'Ragi browns quickly, so keep the heat at medium.' } },\n  { n: 'Sabudana Khichdi', desc: 'Pearl sago with peanuts, a vrat favourite', t: 25, d: 'veg', roots: 'adapt', core: ['sabudana', 'peanuts'], opt: ['potato', 'chilli'], tags: ['new'], tip: 'Skip potato; extra peanuts keep it filling.',\n    r: { serves: 2, ing: [['sabudana', '1 cup sabudana, soaked 4–6 hours'], ['peanuts', '½ cup roasted peanuts, crushed'], ['potato', '1 boiled potato, cubed'], ['chilli', '2 green chillies'], [0, '1 tsp cumin, 1 tbsp ghee'], [0, 'Salt, pinch of sugar, lemon, coriander']],\n      steps: ['Drain the soaked sabudana and mix it with crushed peanuts, salt and sugar.', 'Heat ghee, then add cumin, chilli and potato.', 'Add the sabudana and toss on low heat for 5–6 minutes until translucent.', 'Finish with lemon and coriander.'],\n      tip: 'Soak with water just level with the pearls. Press one: it should squash fully.' } },\n  { n: 'Semiya Upma', desc: 'Vermicelli upma with veggies', t: 15, d: 'veg', roots: 'adapt', core: ['vermicelli'], opt: ['veg', 'onion', 'chilli', 'peanuts'], tags: ['quick', 'new'], tip: 'Use peas, capsicum and tomato; skip onion.',\n    r: { serves: 2, ing: [['vermicelli', '1 cup vermicelli'], ['veg', '½ cup mixed veggies'], ['onion', '1 onion, chopped'], ['chilli', '1 green chilli'], ['peanuts', '1 tbsp peanuts'], [0, 'Mustard seeds, urad dal, curry leaves'], [0, '1½ cups water, salt, lemon, oil']],\n      steps: ['Roast the vermicelli until golden (skip this if it’s pre-roasted).', 'Temper the spices, then sauté the onion, veggies and peanuts.', 'Add water and salt and bring to a boil.', 'Add the vermicelli, cover and cook on low for 3–4 minutes until the water is absorbed.', 'Finish with lemon.'],\n      tip: 'Stick to 1 cup vermicelli to 1½ cups water. Any more and it turns sticky.' } },\n  { n: 'Ven Pongal', desc: 'Comforting rice and moong dal with pepper and ghee', t: 30, d: 'veg', roots: 'adapt', core: ['rice', 'moong'], opt: ['peanuts'], tags: ['healthy'], tip: 'Pepper and cumin carry the flavour on their own.',\n    r: { serves: 3, ing: [['rice', '½ cup rice'], ['moong', '¼ cup moong dal'], ['peanuts', 'Cashews or peanuts'], ['ginger', '1 tsp chopped ginger'], [0, '1 tsp crushed pepper, 1 tsp cumin, curry leaves'], [0, '3 tbsp ghee, salt, 3 cups water']],\n      steps: ['Dry-roast the moong dal for 2 minutes.', 'Pressure-cook the rice and dal with water and salt for 4 whistles.', 'Heat ghee and fry the pepper, cumin, ginger, curry leaves and nuts.', 'Pour over the pongal, mash slightly and serve hot.'],\n      tip: 'Pongal thickens as it sits. Loosen it with a splash of hot water before serving.' } },\n  { n: 'Khaman Dhokla', desc: 'Soft, spongy steamed besan cakes from Gujarat', t: 30, d: 'veg', roots: 'no', core: ['besan', 'curd'], opt: ['chilli'], tags: ['healthy', 'new'], tip: '',\n    r: { serves: 3, ing: [['besan', '1½ cups besan'], ['curd', '½ cup curd'], ['chilli', '2 green chillies, slit'], [0, '1 tsp Eno, 1 tbsp lemon juice, 1 tbsp sugar, ¼ tsp turmeric'], [0, '¾ cup water, salt'], [0, 'To temper: mustard seeds, sesame, curry leaves, 2 tbsp sugar-water']],\n      steps: ['Whisk the besan, curd, water, turmeric, salt, sugar and lemon juice into a smooth batter. Rest for 10 minutes.', 'Grease a plate and bring water to a boil in a steamer.', 'Add Eno to the batter, stir quickly until frothy and pour into the plate.', 'Steam on high for 12–15 minutes, until a toothpick comes out clean.', 'Temper mustard seeds, sesame, chilli and curry leaves, add the sugar-water, pour over the dhokla and cut into squares.'],\n      tip: 'Don’t open the steamer for the first 10 minutes, or the dhokla will sink.' } },\n  { n: 'Sooji Cheela', desc: 'Instant semolina pancakes with tomato and capsicum', t: 20, d: 'veg', roots: 'no', core: ['rava', 'curd'], opt: ['tomato', 'veg', 'chilli'], tags: ['quick', 'healthy'], tip: '',\n    r: { serves: 2, ing: [['rava', '1 cup sooji'], ['curd', '½ cup curd'], ['tomato', '1 tomato, finely chopped'], ['veg', '2 tbsp capsicum, chopped'], ['chilli', '1 green chilli'], [0, 'Salt, ½ tsp cumin, coriander'], [0, 'About ½ cup water, oil']],\n      steps: ['Mix the sooji, curd, salt and water into a thick, pourable batter. Rest for 10 minutes.', 'Stir in the tomato, capsicum, chilli, cumin and coriander.', 'Spread a ladle of batter on a greased tawa.', 'Cook both sides with a little oil until golden.'],\n      tip: 'Sooji keeps soaking up liquid. If the batter thickens while resting, add a spoon of water.' } },\n  { n: 'Paneer Sandwich', desc: 'Toasted sandwich with a spiced paneer filling', t: 15, d: 'veg', roots: 'no', core: ['bread', 'paneer'], opt: ['tomato', 'veg', 'cheese', 'chilli'], tags: ['quick'], tip: '',\n    r: { serves: 2, ing: [['bread', '4 bread slices'], ['paneer', '150 g paneer, crumbled'], ['tomato', '1 tomato, chopped'], ['veg', '2 tbsp capsicum, chopped'], ['cheese', 'Cheese slice (optional)'], ['chilli', '1 green chilli, minced'], [0, 'Salt, pepper, chaat masala, coriander'], [0, 'Butter or green chutney']],\n      steps: ['Mix the paneer with tomato, capsicum, chilli and spices.', 'Butter the bread or spread green chutney.', 'Spread the filling, add cheese and close.', 'Toast for 3–4 minutes until golden.'],\n      tip: 'Stir a spoon of curd into the filling to keep it moist.' } },\n  { n: 'Egg Dosa', desc: 'Street-style dosa with an egg spread on top', t: 15, d: 'egg', roots: 'no', core: ['batter', 'eggs'], opt: ['onion', 'chilli'], tags: ['quick', 'new'], tip: '',\n    r: { serves: 2, ing: [['batter', '2 cups dosa batter'], ['eggs', '2 eggs'], ['onion', '½ onion, finely chopped'], ['chilli', '1 green chilli, chopped'], [0, 'Salt, pepper, a pinch of chilli powder'], [0, 'Oil or butter']],\n      steps: ['Spread a ladle of batter on a hot tawa, slightly thicker than a plain dosa.', 'Crack an egg on top and spread it over with t chillies'], ['garlic', '1 tbsp ginger-garlic paste'], [0, '1 tsp chilli powder, 1 tsp garam masala, ½ cup peas'], [0, 'Butter, coriander, lemon, salt']],\n      steps: ['Sauté the onion in oil until golden, then add ginger-garlic paste.', 'Add the keema and brown on high heat for 5 minutes.', 'Add tomato, spices and salt; cover and cook for 20–25 minutes with a splash of water.', 'Add peas and finish with garam masala and coriander.', 'Toast the pav in butter and serve.'],\n      tip: 'Use a pressure cooker (3 whistles) to bring the total time down to about 25 minutes.' } }\n];\n\nconst DIETS = [\n  { id: 'jain', label: 'Jain', sub: 'No root veg, no egg', mark: '#1F8A3B' },\n  { id: 'veg', label: 'Vegetarian', sub: 'No egg, no meat', mark: '#1F8A3B' },\n  { id: 'egg', label: 'Eggetarian', sub: 'Veg plus eggs', mark: '#C99400' },\n  { id: 'nonveg', label: 'Non-veg', sub: 'Everything goes', mark: '#A0392B' }\n];\nconst TIMES = [10, 20, 30, 45];\nconst GOALS = [\n  { id: 'quick', label: 'Quick & easy', sub: 'Least effort' },\n  { id: 'healthy', label: 'Light & healthy', sub: 'Easy on the stomach' },\n  { id: 'new', label: 'Something new', sub: 'Break the routine' },\n  { id: 'have', label: 'Cook with what I have', sub: 'No shopping run' }\n];\nconst TAG_LABEL = { quick: 'Quick', healthy: 'Light', new: 'Something new' };\nconst GREEN = 'var(--leaf)';\n\nfunction dietInfo(dish, diet) {\n  if (dish.d === 'egg') return { label: 'Contains egg', mark: '#C99400' };\n  if (dish.d === 'nonveg') return { label: 'Non-veg', mark: '#A0392B' };\n  if (diet === 'jain') return { label: dish.roots === 'no' ? 'Jain-friendly' : 'Jain version', mark: '#1F8A3B' };\n  return { label: dish.roots === 'no' ? 'Veg · Jain-friendly' : 'Veg', mark: '#1F8A3B' };\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const now = Date.now();\n    const today = new Date().toDateString();\n    const base = { draft: '', page: 0, open: null, notice: '', addNote: '', showAll: false, toast: '', copied: '', copyFallback: '' };\n    const saved = loadSaved();\n    if (saved && saved.v === 1) {\n      const newVisit = !saved.lastSeen || now - saved.lastSeen > VISIT_GAP_MS;\n      const stats = Object.assign(freshStats(), saved.stats || {});\n      if (newVisit) stats.visits += 1;\n      this.state = Object.assign(base, {\n        diet: saved.diet || null, time: saved.time == null ? null : saved.time, goal: saved.goal || null,\n        have: saved.have || [], custom: saved.custom || [],\n        log: (saved.log || []).filter((e) => now - e.at < 14 * DAY_MS),\n        stats, visitId: newVisit ? now : (saved.visitId || now),\n        skipped: saved.skippedDay === today ? (saved.skipped || []) : [],\n        sample: !!saved.sample\n      });\n    } else {\n      // First open: a sample kitchen so picks show up immediately\n      this.state = Object.assign(base, {\n        diet: 'veg', time: 20, goal: null, have: SAMPLE.slice(), custom: [],\n        log: [], stats: freshStats(), visitId: now, skipped: [], sample: true\n      });\n    }\n    this.storageOk = true;\n  }\n\n  persist() {\n    const st = this.state;\n    this.storageOk = writeSaved({\n      v: 1, diet: st.diet, time: st.time, goal: st.goal, have: st.have, custom: st.custom,\n      log: st.log, stats: st.stats, visitId: st.visitId, lastSeen: Date.now(),\n      skipped: st.skipped, skippedDay: new Date().toDateString(), sample: st.sample\n    });\n  }\n\n  componentDidMount() { this.persist(); this.forceUpdate(); }\n  componentDidUpdate() { this.persist(); }\n\n  recentMap() {\n    const now = Date.now();\n    const map = {};\n    this.state.log.forEach((e) => {\n      if (now - e.at < 2 * DAY_MS) map[e.n] = 'Cooked ' + whenText(daysAgo(e.at));\n    });\n    return map;\n  }\n\n  cookedThisVisit(name) {\n    return this.state.log.some((e) => e.n === name && e.at >= this.state.visitId);\n  }\n\n  message(dish) {\n    return 'Breakfast plan: ' + dish.n + ' (' + dish.t + ' min). Okay with everyone?';\n  }\n\n  cook(dish) {\n    const st = this.state;\n    if (this.cookedThisVisit(dish.n)) { this.setState({ toast: 'Already logged this morning. Enjoy!' }); return; }\n    const now = Date.now();\n    const log = st.log.filter((e) => now - e.at < 14 * DAY_MS).concat({ n: dish.n, at: now });\n    const stats = Object.assign({}, st.stats, { cooked: st.stats.cooked + 1 });\n    // Acceptance counts once per visit, however many times you tap\n    if (stats.lastCookedVisit !== st.visitId) {\n      stats.cookedVisits = stats.cookedVisits + 1;\n      stats.lastCookedVisit = st.visitId;\n    }\n    this.setState({ log, stats, toast: 'Logged! Enjoy your ' + dish.n + '. It’ll rank lower for the next 2 days so breakfasts stay varied.' });\n  }\n\n  copy(dish) {\n    const msg = this.message(dish);\n    const done = () => this.setState({ copied: dish.n, copyFallback: '' });\n    const fail = () => this.setState({ copied: '', copyFallback: msg });\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done, fail);\n      else fail();\n    } catch (e) { fail(); }\n  }\n\n  matchCustom(text) {\n    const s = text.toLowerCase();\n    const hits = [];\n    ING.forEach((i) => {\n      const hit = i.alias.some((a) => new RegExp('(^|[^a-z])' + a + '(s|es)?([^a-z]|$)').test(s) || (s.length >= 3 && a.startsWith(s)));\n      if (hit) hits.push(i.id);\n    });\n    return hits;\n  }\n\n  haveSet() {\n    const set = new Set(this.state.have);\n    this.state.custom.forEach((c) => this.matchCustom(c).forEach((id) => set.add(id)));\n    const forbid = this.state.diet ? FORBID[this.state.diet] : [];\n    forbid.forEach((id) => set.delete(id));\n    return set;\n  }\n\n  allowed(dish, diet) {\n    if (diet === 'jain') return dish.d === 'veg' && dish.roots !== 'yes';\n    if (diet === 'veg') return dish.d === 'veg';\n    if (diet === 'egg') return dish.d !== 'nonveg';\n    return true;\n  }\n\n  // Key ingredients the user would actually use (Jain drops root veg)\n  keys(dish) {\n    const k = dish.core.concat(dish.opt);\n    return this.state.diet === 'jain' ? k.filter((id) => !ROOTS.includes(id)) : k;\n  }\n\n  analyse(dish, have) {\n    const { time, goal } = this.state;\n    const hasIng = have.size > 0;\n    const keys = this.keys(dish);\n    const haveKeys = keys.filter((id) => have.has(id));\n    const missing = keys.filter((id) => !have.has(id));\n    const main = dish.core[0];\n    const haveMain = have.has(main);\n    const limited = time !== null && time < 45;\n    const fits = !limited || dish.t <= time;\n    const goalMatch = goal === 'quick' ? dish.t <= 15\n      : goal === 'healthy' ? dish.tags.includes('healthy')\n      : goal === 'new' ? dish.tags.includes('new')\n      : goal === 'have' ? missing.length === 0 : false;\n\n    // Ranking: key ingredients you have dominate, the main ingredient is a big boost,\n    // the goal nudges, and quicker dishes win ties. (Time-fit is applied as a hard tier when sorting.)\n    let s = 0;\n    if (hasIng) s += haveKeys.length * 12 + (haveMain ? 30 : 0) + (haveKeys.length / keys.length) * 10;\n    if (goalMatch) s += hasIng ? 8 : 20;\n    if (goal === 'quick') s += Math.max(0, 30 - dish.t) / 3;\n    s -= dish.t / 20;\n    // Cooked in the last 2 days: rank lower to keep breakfasts varied\n    const recent = this.recent ? this.recent[dish.n] || '' : '';\n    if (recent) s -= 60;\n\n    let pct = hasIng\n      ? 30 + 50 * (haveKeys.length / keys.length) + (haveMain ? 15 : 0) + (goalMatch ? 5 : 0)\n      : 60 + (goalMatch ? 25 : 0) + (goal ? 0 : 10);\n    if (!fits) pct -= 20;\n    pct = Math.max(20, Math.min(99, Math.round(pct)));\n\n    // One-line why\n    let why;\n    const quickBit = dish.t <= 15 ? ', ready in ' + dish.t + ' min' : '';\n    if (!fits) why = 'Over your time at ' + dish.t + ' min, but nothing quicker matches';\n    else if (recent) why = 'You had this ' + recent.replace('Cooked ', '') + ', so it’s ranked lower for variety';\n    else if (hasIng && missing.length === 0) why = 'You have everything' + quickBit;\n    else if (hasIng && missing.length === 1) why = 'Only missing ' + LABEL[missing[0]] + quickBit;\n    else if (hasIng && haveMain) why = 'You have the main ingredient (' + LABEL[main] + ')' + quickBit;\n    else if (hasIng) why = 'Uses your ' + listNice(haveKeys.map((id) => LABEL[id])) + ', but you’ll need ' + LABEL[main];\n    else if (goal === 'quick' || dish.t <= 15) why = 'Ready in ' + dish.t + ' min';\n    else if (goal === 'healthy' && dish.tags.includes('healthy')) why = 'Light and nourishing, ready in ' + dish.t + ' min';\n    else if (goal === 'new' && dish.tags.includes('new')) why = 'A break from the usual poha-upma rotation';\n    else if (limited) why = 'Fits your ' + time + ' min window';\n    else why = 'A reliable favourite, ready in ' + dish.t + ' min';\n\n    const missText = missing.length === 0 ? (hasIng ? 'Nothing. You’re set!' : 'Tap ingredients to check')\n      : missing.map((id) => LABEL[id] + (dish.core.includes(id) ? '' : ' (optional)')).join(', ');\n    const mainLine = !hasIng ? 'Main: ' + LABEL[main] : haveMain ? 'Main (' + LABEL[main] + '): you have it' : 'Main (' + LABEL[main] + '): missing';\n    return { s, pct, why, fits, recent, haveCount: haveKeys.length, keyCount: keys.length, missing, missText, hasIng, haveMain, mainLine };\n  }\n\n  pickDiet(id) {\n    const st = this.state;\n    const forbid = FORBID[id];\n    const dropped = st.have.filter((x) => forbid.includes(x)).map((x) => LABEL[x]);\n    const keepCustom = st.custom.filter((c) => !this.matchCustom(c).some((h) => forbid.includes(h)));\n    const droppedCustom = st.custom.filter((c) => !keepCustom.includes(c));\n    const names = dropped.concat(droppedCustom);\n    const dl = DIETS.find((d) => d.id === id).label;\n    const notice = names.length\n      ? 'Removed ' + listNice(names) + ' from your kitchen — not part of ' + dl + ' meals.'\n      : '';\n    this.set({ diet: id, have: st.have.filter((x) => !forbid.includes(x)), custom: keepCustom, notice, addNote: '' });\n  }\n\n  set(patch) { this.setState(Object.assign({ page: 0, sample: false }, patch)); }\n\n  skip(name) {\n    const st = this.state;\n    if (st.skipped.includes(name)) return;\n    const stats = Object.assign({}, st.stats, { skipped: st.stats.skipped + 1 });\n    this.setState({ skipped: st.skipped.concat(name), stats, open: null, toast: '', copied: '', copyFallback: '' });\n  }\n\n  addDraft() {\n    const st = this.state;\n    const v = st.draft.trim().replace(/\\s+/g, ' ');\n    if (!v) return;\n    const low = v.toLowerCase();\n    const forbid = st.diet ? FORBID[st.diet] : [];\n    const exact = ING.find((i) => i.label.toLowerCase() === low || i.alias.includes(low));\n    const hits = exact ? [exact.id] : this.matchCustom(low);\n    if (hits.some((h) => forbid.includes(h))) {\n      const dl = DIETS.find((d) => d.id === st.diet).label;\n      this.setState({ draft: '', addNote: '“' + v + '” isn’t part of ' + dl + ' meals, so I left it out.' });\n      return;\n    }\n    if (exact) {\n      const have = st.have.includes(exact.id) ? st.have : st.have.concat(exact.id);\n      this.set({ have, draft: '', addNote: 'Selected ' + exact.label + ' in the list.' });\n      return;\n    }\n    if (st.custom.some((c) => c.toLowerCase() === low)) { this.setState({ draft: '', addNote: '' }); return; }\n    this.set({ custom: st.custom.concat(v), draft: '',\n      addNote: hits.length ? '' : 'Added. None of our dishes use ' + v + ' yet, so it won’t change the suggestions.' });\n  }\n\n  buildSheet(dish, have) {\n    const diet = this.state.diet;\n    const a = this.analyse(dish, have);\n    const known = new Set(ING.map((i) => i.id));\n    // Jain: root vegetables (and ginger/garlic) are simply left out of the list\n    const rows = diet === 'jain' ? dish.r.ing.filter(([id]) => !ROOTS.includes(id)) : dish.r.ing;\n    const ing = rows.map(([id, text]) => {\n      if (id && diet === 'jain' && ROOTS.includes(id)) return { text, status: 'Skip for Jain', sBg: 'var(--soft2)', sFg: 'var(--muted)', textColor: 'var(--muted)', strike: 'line-through' };\n      if (!id || !known.has(id)) return { text, status: 'Pantry', sBg: 'var(--bg)', sFg: 'var(--muted)', textColor: 'var(--ink)', strike: 'none' };\n      if (have.has(id)) return { text, status: 'In kitchen', sBg: 'var(--leaf-soft)', sFg: 'var(--leaf-ink)', textColor: 'var(--ink)', strike: 'none' };\n      const optional = !dish.core.includes(id);\n      return { text, status: optional ? 'Missing · optional' : 'Missing', sBg: 'var(--chili-soft)', sFg: 'var(--chili-ink)', textColor: 'var(--ink)', strike: 'none' };\n    });\n    return {\n      name: dish.n, time: dish.t, serves: dish.r.serves, dietLabel: dietInfo(dish, diet).label,\n      haveText: a.haveCount + '/' + a.keyCount,\n      ing, steps: dish.r.steps.map((text, i) => ({ n: i + 1, text: diet === 'jain' ? text.replace(/,? (and )?ginger(-garlic paste)?/g, '') : text })), tip: dish.r.tip,\n      hasJain: diet === 'jain' && dish.roots === 'adapt' && !!dish.tip, jainTip: dish.tip,\n      skip: () => this.skip(dish.n),\n      cook: () => this.cook(dish),\n      cookLabel: this.cookedThisVisit(dish.n) ? 'Cooking this ✓' : 'I’m cooking this',\n      copy: () => this.copy(dish),\n      copyLabel: this.state.copied === dish.n ? 'Copied ✓ Paste in WhatsApp' : 'Copy message for family',\n      waHref: 'https://wa.me/?text=' + encodeURIComponent(this.message(dish))\n    };\n  }\n\n  greet() {\n    const now = new Date();\n    const h = now.getHours();\n    const day = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][now.getDay()];\n    const evening = h >= 17 || h < 4;\n    const part = h >= 4 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : 'Good evening';\n    return {\n      greeting: part + ' · ' + day + (evening ? ' · planning tomorrow?' : ''),\n      tagline: evening ? 'Pick tomorrow’s breakfast tonight and skip the morning debate.' : 'Four quick taps. Three breakfasts you can actually make today.',\n      resultsTitle: evening ? 'Tomorrow’s top 3' : 'Your top 3',\n      ctaText: evening ? 'See tomorrow’s picks' : 'See my top 3'\n    };\n  }\n\n  renderVals() {\n    const st = this.state;\n    this.recent = this.recentMap();\n    const hello = this.greet();\n    const sel = (on) => ({ bg: on ? 'var(--leaf-soft)' : 'var(--card)', bd: on ? GREEN : 'var(--line)' });\n\n    const dietOpts = DIETS.map((d) => Object.assign({}, d, sel(st.diet === d.id), {\n      on: st.diet === d.id, pick: () => this.pickDiet(d.id)\n    }));\n    const timeOpts = TIMES.map((t) => {\n      const on = st.time === t;\n      return { label: t === 45 ? '45+' : String(t), on, bg: on ? GREEN : 'var(--card)', fg: on ? 'var(--card)' : 'var(--ink)', bd: on ? GREEN : 'var(--line)',\n        pick: () => this.set({ time: on ? null : t }) };\n    });\n    const goalOpts = GOALS.map((g) => Object.assign({}, g, sel(st.goal === g.id), {\n      on: st.goal === g.id, pick: () => this.set({ goal: st.goal === g.id ? null : g.id })\n    }));\n    const forbid = st.diet ? FORBID[st.diet] : [];\n    const chip = (i) => {\n      const on = st.have.includes(i.id);\n      return { label: i.label, on, bg: on ? GREEN : 'var(--card)', fg: on ? 'var(--card)' : 'var(--ink)', bd: on ? GREEN : 'var(--line-strong)',\n        pick: () => this.set({ have: on ? st.have.filter((x) => x !== i.id) : st.have.concat(i.id), addNote: '' }) };\n    };\n    const groups = GROUPS.map((g) => ({\n      label: g.label,\n      chips: ING.filter((i) => i.g === g.id && !forbid.includes(i.id)).map(chip)\n    })).filter((g) => g.chips.length > 0);\n    const customChips = st.custom.map((c) => ({ label: c, remove: () => this.set({ custom: st.custom.filter((x) => x !== c) }) }));\n\n    const have = this.haveSet();\n    let results = [];\n    let pageNote = '';\n    let emptyMsg = '';\n    let hasMore = false;\n    let more = [];\n    let moreNote = '';\n    let canShowAll = false;\n    let showAllText = '';\n    let matchCount = 0;\n    let unlocks = [];\n    if (st.diet) {\n      const hasIng = have.size > 0;\n      let pool = DISHES.filter((d) => this.allowed(d, st.diet) && !st.skipped.includes(d.n))\n        .map((d) => ({ dish: d, a: this.analyse(d, have) }));\n      // Hide dishes that use none of what you picked\n      if (hasIng) pool = pool.filter((x) => x.a.haveCount > 0);\n      // Cook with what I have: at most one key item missing\n      if (st.goal === 'have') pool = hasIng ? pool.filter((x) => x.a.haveMain && x.a.missing.length <= 1) : [];\n      // Dishes within your time always come first; longer ones only after them\n      pool.sort((x, y) => (Number(y.a.fits) - Number(x.a.fits)) || (y.a.s - x.a.s) || (x.dish.t - y.dish.t));\n      const ranked = pool;\n      const p = 0;\n      matchCount = ranked.length;\n      hasMore = ranked.length > 3;\n      const pctOf = (a) => (a.keyCount ? Math.round((a.haveCount / a.keyCount) * 100) : 0);\n\n      // More options: everything after the top 3\n      const rest = ranked.slice(3);\n      const limit = st.showAll ? rest.length : 6;\n      more = rest.slice(0, limit).map((x) => {\n        const a = x.a;\n        return {\n          name: x.dish.n, over: !a.fits, havePct: pctOf(a),\n          meta: x.dish.t + ' min · ' + dietInfo(x.dish, st.diet).label + ' · '\n            + (a.hasIng ? a.haveCount + '/' + a.keyCount + ' in kitchen' : a.keyCount + ' key ingredients')\n            + (a.recent ? ' · ' + a.recent : ''),\n          open: () => this.setState({ open: x.dish.n }),\n          skip: () => this.skip(x.dish.n)\n        };\n      });\n      canShowAll = rest.length > 6;\n      showAllText = st.showAll ? 'Show fewer' : 'Show all ' + rest.length;\n      moreNote = rest.length + (rest.length === 1 ? ' more dish' : ' more dishes');\n\n      // Add one item to unlock: dishes that become makeable (at most one key item missing)\n      if (hasIng) {\n        const base = DISHES.filter((d) => this.allowed(d, st.diet) && !st.skipped.includes(d.n));\n        const ready = (d, set) => { const a = this.analyse(d, set); return a.haveMain && a.missing.length <= 1; };\n        const readyNow = new Set(base.filter((d) => ready(d, have)).map((d) => d.n));\n        unlocks = ING.filter((i) => !forbid.includes(i.id) && !have.has(i.id)).map((i) => {\n          const set = new Set(have);\n          set.add(i.id);\n          const n = base.filter((d) => !readyNow.has(d.n) && ready(d, set)).length;\n          return { id: i.id, label: i.label, n };\n        }).filter((u) => u.n > 0)\n          .sort((x, y) => y.n - x.n)\n          .slice(0, 3)\n          .map((u) => ({\n            label: u.label, countText: u.n + (u.n === 1 ? ' dish' : ' dishes'),\n            add: () => this.set({ have: st.have.concat(u.id), addNote: '' })\n          }));\n      }\n      const overCount = ranked.filter((x) => !x.a.fits).length;\n      if (!ranked.length) {\n        if (st.goal === 'have' && !hasIng) emptyMsg = 'Tap what’s in your kitchen and I’ll show dishes you can make with at most one item missing.';\n        else if (st.goal === 'have') emptyMsg = 'Nothing is within one item of what you have. Add a few more ingredients, or pick another goal.';\n        else if (hasIng && st.skipped.length === 0) emptyMsg = 'None of our dishes use what you’ve picked. Add a staple like poha, rava, atta or bread.';\n        else emptyMsg = 'You’ve skipped everything that matches. Bring some back below.';\n      }\n      const rankBgs = ['var(--turmeric)', 'var(--rank2)', 'var(--rank3)'];\n      results = ranked.slice(p * 3, p * 3 + 3).map((x, i) => {\n        const d = x.dish;\n        const a = x.a;\n        const di = dietInfo(d, st.diet);\n        const noneMissing = a.hasIng && a.missing.length === 0;\n        return {\n          rank: p * 3 + i + 1, rankBg: rankBgs[i], name: d.n, desc: d.desc, time: d.t,\n          pct: a.pct, over: !a.fits, mainLine: a.mainLine, havePct: pctOf(a),\n          isRecent: !!a.recent, recentLabel: a.recent,\n          dietLabel: di.label, mark: di.mark,\n          tags: d.tags.map((t) => TAG_LABEL[t]),\n          haveText: a.haveCount + '/' + a.keyCount,\n          missText: a.missText,\n          missBg: noneMissing ? 'var(--leaf-soft)' : (a.hasIng ? 'var(--chili-soft)' : 'var(--bg)'),\n          missFg: noneMissing ? 'var(--leaf-ink)' : (a.hasIng ? 'var(--chili-ink)' : 'var(--muted)'),\n          why: a.why,\n          hasTip: st.diet === 'jain' && d.roots === 'adapt' && !!d.tip, tip: d.tip,\n          open: () => this.setState({ open: d.n }),\n          skip: () => this.skip(d.n)\n        };\n      });\n      pageNote = ranked.length\n        ? 'Showing ' + (p * 3 + 1) + '–' + (p * 3 + results.length) + ' of ' + ranked.length + (ranked.length === 1 ? ' match' : ' matches')\n          + (overCount ? ' · ' + overCount + ' over your time' : '')\n        : '';\n    }\n\n    const haveCount = st.have.length + st.custom.length;\n    const parts = [];\n    if (st.diet) {\n      parts.push(DIETS.find((d) => d.id === st.diet).label);\n      parts.push(haveCount ? haveCount + (haveCount === 1 ? ' ingredient' : ' ingredients') + ' selected' : 'No ingredients selected');\n      parts.push(matchCount + (matchCount === 1 ? ' dish matches' : ' dishes match'));\n    }\n\n    const openDish = st.open ? DISHES.find((d) => d.n === st.open) : null;\n    const emptySheet = { name: '', time: 0, serves: 0, dietLabel: '', haveText: '', ing: [], steps: [], tip: '', hasJain: false, jainTip: '',\n      skip: () => {}, cook: () => {}, cookLabel: '', copy: () => {}, copyLabel: '', waHref: '#' };\n\n    // Your mornings so far\n    const sx = st.stats;\n    const rate = sx.visits > 0 ? Math.round((sx.cookedVisits / sx.visits) * 100) : 0;\n    const last = st.log.length ? st.log[st.log.length - 1] : null;\n\n    return {\n      dietOpts, timeOpts, goalOpts, groups, customChips, results, pageNote,\n      hasCustom: st.custom.length > 0,\n      greeting: hello.greeting, tagline: hello.tagline, resultsTitle: hello.resultsTitle, ctaText: hello.ctaText,\n      kitchenNote: st.diet === 'jain'\n        ? 'Root vegetables like onion, potato and carrot are hidden for Jain. Tap the staples you have, or skip this and we’ll suggest anything that fits.'\n        : 'Tap everything you have. Skip this and we’ll suggest anything that fits.',\n      notice: st.notice, hasNotice: !!st.notice, dismissNotice: () => this.setState({ notice: '' }),\n      addNote: st.addNote, hasAddNote: !!st.addNote,\n      emptyMsg, showEmpty: !!st.diet && !!emptyMsg, hasMore,\n      more, moreNote, canShowAll, showAllText, toggleAll: () => this.setState({ showAll: !st.showAll }),\n      unlocks, hasUnlocks: unlocks.length > 0,\n      sample: !!st.sample,\n      clearSample: () => this.set({ have: [], custom: [], sample: false }),\n      hasToast: !!st.toast, toast: st.toast,\n      hasCopyFallback: !!st.copyFallback, copyFallback: st.copyFallback,\n      statCooked: sx.cooked, statRate: rate + '%', statSkipped: sx.skipped,\n      statsNote: (this.storageOk ? 'Saved in this browser' : 'Not saved: this browser is blocking storage') + ' · ' + sx.visits + (sx.visits === 1 ? ' visit' : ' visits'),\n      lastCooked: last ? 'Last cooked: ' + last.n + ', ' + whenText(daysAgo(last.at)) : 'Tap “I’m cooking this” in a recipe to start your log.',\n      resetStats: () => this.setState({ stats: freshStats(), log: [] }),\n      needDiet: !st.diet, showResults: !!st.diet,\n      summary: parts.join(' · '),\n      hasAnyIng: haveCount > 0, haveCount,\n      clearIng: () => this.set({ have: [], custom: [] }),\n      draft: st.draft,\n      onDraft: (e) => this.setState({ draft: e.target.value }),\n      onDraftKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.addDraft(); } },\n      addDraft: () => this.addDraft(),\n      next: () => this.setState({ page: st.page + 1 }),\n      hasSkipped: st.skipped.length > 0,\n      skippedText: st.skipped.join(', '),\n      undoSkip: () => this.set({ skipped: [] }),\n      sheetOpen: !!openDish,\n      sheet: openDish ? this.buildSheet(openDish, have) : emptySheet,\n      closeSheet: () => this.setState({ open: null, toast: '', copied: '', copyFallback: '' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
