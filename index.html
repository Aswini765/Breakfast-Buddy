<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakfast Buddy</title>
<meta name="description" content="Breakfast Buddy picks the top 3 Indian breakfasts for your diet, time, goal and the ingredients in your kitchen.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23F0A818%22/%3E%3Cpath d=%22M12 32h40M14 32a18 18 0 0 0 36 0%22 fill=%22none%22 stroke=%22%232A1E00%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
--bg:#FAF6EC;--card:#FFFFFF;--ink:#1F2A1E;--muted:#585F50;--line:#ECE4D2;--line-strong:#D3C8AE;--soft2:#F3ECDB;--track:#E6DCC4;
--leaf:#2E6B34;--leaf-ink:#1E4A23;--leaf-soft:#E7F1E1;
--turmeric:#F0A818;--on-turmeric:#2A1E00;--turmeric-soft:#FDF1CF;--turmeric-line:#F3DE9C;--turmeric-ink:#5C4100;--rank2:#F6CB5E;--rank3:#FBE3A0;
--chili-soft:#FCE5D6;--chili-ink:#8A3B0B;--sky-soft:#E6EFF8;--sky-ink:#1D3A5C;
--panel:#1F2A1E;--panel-tile:#2B3A2A;--panel-text:#FFFFFF;--panel-muted:#DCE3D8;--panel-line:#6B7B6A;
--display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#121510;--card:#1B1F18;--ink:#EEF0E4;--muted:#AEB5A4;--line:#2D3328;--line-strong:#454D3E;--soft2:#252B21;--track:#333B2D;
--leaf:#8FCB8A;--leaf-ink:#C3E6BE;--leaf-soft:#1F3320;
--turmeric:#F2B52E;--on-turmeric:#221800;--turmeric-soft:#2C2510;--turmeric-line:#4A3D14;--turmeric-ink:#F5D47A;--rank2:#D9AE3A;--rank3:#B8933A;
--chili-soft:#3B2216;--chili-ink:#F4B28C;--sky-soft:#17263A;--sky-ink:#AFCBEE;
--panel:#0C0F0B;--panel-tile:#1A2018;--panel-line:#4D584A}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#121510;--card:#1B1F18;--ink:#EEF0E4;--muted:#AEB5A4;--line:#2D3328;--line-strong:#454D3E;--soft2:#252B21;--track:#333B2D;
--leaf:#8FCB8A;--leaf-ink:#C3E6BE;--leaf-soft:#1F3320;
--turmeric:#F2B52E;--on-turmeric:#221800;--turmeric-soft:#2C2510;--turmeric-line:#4A3D14;--turmeric-ink:#F5D47A;--rank2:#D9AE3A;--rank3:#B8933A;
--chili-soft:#3B2216;--chili-ink:#F4B28C;--sky-soft:#17263A;--sky-ink:#AFCBEE;
--panel:#0C0F0B;--panel-tile:#1A2018;--panel-line:#4D584A}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
a{color:var(--leaf)}a:hover{color:var(--leaf-ink)}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:var(--muted);opacity:.8}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--turmeric);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
body.sheet-open{overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.col-left{flex:1 1 540px;min-width:0;display:flex;flex-direction:column;gap:16px}
.col-right{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.step-h{margin:0;font-family:var(--display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.step-n{width:28px;height:28px;border-radius:99px;background:var(--soft2);display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.group-h{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.big-num{font-family:var(--display);font-weight:800;line-height:1}
@media (max-width:420px){
  h1.title{font-size:28px!important}
  .grid4{gap:6px}
  .stat-num{font-size:26px!important}
  .stat-tile{padding:12px!important}
}
@media (prefers-reduced-motion:no-preference){.chip,.opt{transition:background-color .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<div class="wrap">

<header style="position:relative;overflow:hidden;background:var(--turmeric-soft);border:1px solid var(--turmeric-line);border-radius:24px;padding:22px 20px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">
<svg width="190" height="190" viewBox="0 0 180 180" fill="currentColor" aria-hidden="true" style="position:absolute;right:-28px;top:-30px;color:var(--leaf);opacity:.16;pointer-events:none"><path d="M20 172 C 70 122 112 80 166 14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path><ellipse cx="59" cy="149" rx="8" ry="20" transform="rotate(-45 59 149)"></ellipse><ellipse cx="31" cy="121" rx="8" ry="20" transform="rotate(-45 31 121)"></ellipse><ellipse cx="84" cy="124" rx="8" ry="21" transform="rotate(-45 84 124)"></ellipse><ellipse cx="56" cy="96" rx="8" ry="21" transform="rotate(-45 56 96)"></ellipse><ellipse cx="109" cy="99" rx="8" ry="21" transform="rotate(-45 109 99)"></ellipse><ellipse cx="81" cy="71" rx="8" ry="21" transform="rotate(-45 81 71)"></ellipse><ellipse cx="134" cy="72" rx="7" ry="19" transform="rotate(-45 134 72)"></ellipse><ellipse cx="106" cy="44" rx="7" ry="19" transform="rotate(-45 106 44)"></ellipse><ellipse cx="157" cy="38" rx="6" ry="16" transform="rotate(-45 157 38)"></ellipse></svg>
<div style="position:relative;display:flex;align-items:center;gap:14px;min-width:0">
<div aria-hidden="true" style="width:54px;height:54px;border-radius:17px;background:var(--turmeric);color:var(--on-turmeric);display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18"></path><path d="M4 12a8 8 0 0 0 16 0"></path><path d="M9 7c0-1.5 1-2 1-3.5"></path><path d="M13 7c0-1.5 1-2 1-3.5"></path></svg>
</div>
<div style="min-width:0">
<p id="greeting" style="margin:0 0 4px;font-size:14px;font-weight:700;color:var(--turmeric-ink);letter-spacing:.02em">Good morning</p>
<h1 class="title" style="margin:0;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em;color:var(--ink)">Breakfast Buddy</h1>
<p id="tagline" style="margin:6px 0 0;color:var(--muted);font-size:16px">Four quick taps. Three breakfasts you can actually make today.</p>
</div>
</div>
<a id="cta" href="#results" style="position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:var(--card);font-weight:600;text-decoration:none">See my top 3</a>
</header>

<div class="cols">
<div class="col-left">

<section class="card" aria-labelledby="h-diet">
<h2 id="h-diet" class="step-h"><span class="step-n">1</span>Who's eating?</h2>
<div class="grid2" id="diet-grid"></div>
<div id="diet-notice"></div>
</section>

<section class="card" aria-labelledby="h-time">
<h2 id="h-time" class="step-h"><span class="step-n">2</span>How much time do you have?</h2>
<div class="grid4" id="time-grid"></div>
</section>

<section class="card" aria-labelledby="h-goal">
<h2 id="h-goal" class="step-h"><span class="step-n">3</span>Today's goal</h2>
<div class="grid2" id="goal-grid"></div>
</section>

<section class="card" aria-labelledby="h-kitchen">
<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
<h2 id="h-kitchen" class="step-h"><span class="step-n">4</span>What's in your kitchen?</h2>
<div id="clear-wrap"></div>
</div>
<p id="kitchen-note" style="margin:0;color:var(--muted);font-size:14px"></p>
<div id="sample-note"></div>
<div id="groups" style="display:flex;flex-direction:column;gap:14px"></div>
<div id="custom-wrap" style="display:flex;flex-direction:column;gap:8px"></div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="bb-add" style="font-size:14px;font-weight:600">Add your own</label>
<div style="display:flex;gap:8px">
<input id="bb-add" type="text" placeholder="e.g. methi, cucumber, sprouts" autocomplete="off" enterkeyhint="done" style="flex:1 1 auto;min-width:0;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line-strong);font-size:16px;color:var(--ink);background:var(--card)">
<button type="button" id="bb-add-btn" style="min-height:44px;padding:0 18px;border-radius:12px;border:none;background:var(--ink);color:var(--card);font-weight:600;font-size:15px">Add</button>
</div>
<p id="add-note" role="status" style="margin:0;font-size:14px;color:var(--turmeric-ink)"></p>
</div>
</section>
</div>

<section id="results" class="col-right" aria-live="polite" aria-labelledby="results-title">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap">
<h2 id="results-title" style="margin:0;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.01em">Your top 3</h2>
<p id="summary" style="margin:0;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)"></p>
</div>
<div id="results-body" style="display:flex;flex-direction:column;gap:14px"></div>
</section>
</div>

<section id="stats" aria-labelledby="bb-stats" style="background:var(--panel);color:var(--panel-text);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px"></section>
</div>

<div id="sheet"></div>
<noscript><p style="text-align:center;padding:16px">Breakfast Buddy needs JavaScript turned on.</p></noscript>

<script>
'use strict';
// ===================== Rendering (vanilla DOM) =====================
(function () {
  var app;
  var handlers = [];
  var queued = false;
  var lastSheetName = null;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Register a click handler and return the attribute that points at it
  function act(fn) { handlers.push(fn); return ' data-act="' + (handlers.length - 1) + '"'; }
  function $(id) { return document.getElementById(id); }

  var X_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
  var CLOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>';

  function mark(color, size) {
    var s = size || 18, d = Math.round(s * 0.44);
    return '<span aria-hidden="true" style="width:' + s + 'px;height:' + s + 'px;border:2px solid ' + color + ';border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card)"><span style="width:' + d + 'px;height:' + d + 'px;border-radius:99px;background:' + color + '"></span></span>';
  }

  function dietHTML(v) {
    return v.dietOpts.map(function (o) {
      return '<button type="button" class="opt"' + act(o.pick) + ' aria-pressed="' + o.on + '" style="min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:2px solid ' + o.bd + ';background:' + o.bg + ';color:var(--ink);text-align:left;font-size:16px">'
        + mark(o.mark)
        + '<span style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:700">' + esc(o.label) + '</span><span style="font-size:13px;color:var(--muted)">' + esc(o.sub) + '</span></span></button>';
    }).join('');
  }

  function noticeHTML(v) {
    if (!v.hasNotice) return '';
    return '<div role="status" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--turmeric-soft);color:var(--turmeric-ink);font-size:14px">'
      + '<span>' + esc(v.notice) + '</span>'
      + '<button type="button"' + act(v.dismissNotice) + ' style="flex-shrink:0;min-height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--turmeric);color:var(--on-turmeric);font-weight:700;font-size:14px">Got it</button></div>';
  }

  function timeHTML(v) {
    return v.timeOpts.map(function (o) {
      return '<button type="button" class="opt"' + act(o.pick) + ' aria-pressed="' + o.on + '" aria-label="' + esc(o.label) + ' minutes" style="min-height:56px;padding:6px;border-radius:14px;border:2px solid ' + o.bd + ';background:' + o.bg + ';color:' + o.fg + ';display:flex;flex-direction:column;align-items:center;justify-content:center">'
        + '<span style="font-family:var(--display);font-weight:700;font-size:20px;line-height:1">' + esc(o.label) + '</span><span style="font-size:12px;font-weight:600">min</span></button>';
    }).join('');
  }

  function goalHTML(v) {
    return v.goalOpts.map(function (o) {
      return '<button type="button" class="opt"' + act(o.pick) + ' aria-pressed="' + o.on + '" style="min-height:56px;padding:10px 14px;border-radius:14px;border:2px solid ' + o.bd + ';background:' + o.bg + ';color:var(--ink);text-align:left;display:flex;flex-direction:column">'
        + '<span style="font-weight:700;font-size:16px">' + esc(o.label) + '</span><span style="font-size:13px;color:var(--muted)">' + esc(o.sub) + '</span></button>';
    }).join('');
  }

  function groupsHTML(v) {
    return v.groups.map(function (g) {
      return '<div style="display:flex;flex-direction:column;gap:8px"><h3 class="group-h">' + esc(g.label) + '</h3><div class="chips">'
        + g.chips.map(function (c) {
          return '<button type="button" class="chip"' + act(c.pick) + ' aria-pressed="' + c.on + '" style="border:1.5px solid ' + c.bd + ';background:' + c.bg + ';color:' + c.fg + '">' + esc(c.label) + '</button>';
        }).join('') + '</div></div>';
    }).join('');
  }

  function customHTML(v) {
    if (!v.hasCustom) return '';
    return '<h3 class="group-h">Your additions</h3><div class="chips">'
      + v.customChips.map(function (c) {
        return '<button type="button" class="chip"' + act(c.remove) + ' aria-label="Remove ' + esc(c.label) + '" style="padding:0 12px 0 14px;border:1.5px solid var(--leaf);background:var(--leaf);color:var(--card);display:inline-flex;align-items:center;gap:8px">' + esc(c.label) + X_ICON + '</button>';
      }).join('') + '</div>';
  }

  function sampleHTML(v) {
    if (!v.sample) return '';
    return '<div role="status" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--sky-soft);color:var(--sky-ink);font-size:14px">'
      + '<span style="flex:1 1 240px">This is a sample kitchen so you can see picks right away. Tap chips to match yours.</span>'
      + '<button type="button"' + act(v.clearSample) + ' style="min-height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--sky-ink);background:var(--card);color:var(--sky-ink);font-weight:700;font-size:14px">Clear sample</button></div>';
  }

  function emptyBox(title, text) {
    return '<div style="background:var(--card);border:1.5px dashed var(--line-strong);border-radius:18px;padding:24px 20px;text-align:center">'
      + '<p style="margin:0;font-weight:700;font-size:17px">' + esc(title) + '</p>'
      + '<p style="margin:6px 0 0;font-size:15px;color:var(--muted)">' + esc(text) + '</p></div>';
  }

  function cardHTML(r) {
    var tags = r.tags.map(function (t) {
      return '<span class="pill" style="background:var(--turmeric-soft);color:var(--turmeric-ink)">' + esc(t) + '</span>';
    }).join('');
    return '<article style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px">'
      + '<div style="display:flex;gap:14px;align-items:flex-start">'
      + '<div style="width:40px;height:40px;border-radius:12px;background:' + r.rankBg + ';color:var(--on-turmeric);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px;flex-shrink:0">' + r.rank + '</div>'
      + '<div style="flex:1 1 auto;min-width:0"><h3 style="margin:0;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.15">' + esc(r.name) + '</h3>'
      + '<p style="margin:3px 0 0;font-size:14px;color:var(--muted)">' + esc(r.desc) + '</p></div>'
      + '<div style="text-align:right;flex-shrink:0"><div class="big-num" style="font-size:22px;color:var(--leaf)">' + r.pct + '%</div><div style="font-size:12px;color:var(--muted)">fit</div></div>'
      + '</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:6px">'
      + '<span class="pill" style="background:var(--bg)">' + CLOCK + r.time + ' min</span>'
      + (r.over ? '<span class="pill" style="background:var(--chili-soft);color:var(--chili-ink);font-weight:700">Over your time</span>' : '')
      + (r.isRecent ? '<span class="pill" style="background:var(--sky-soft);color:var(--sky-ink);font-weight:700">' + esc(r.recentLabel) + '</span>' : '')
      + '<span class="pill" style="background:var(--bg)">' + mark(r.mark, 12) + esc(r.dietLabel) + '</span>'
      + tags + '</div>'
      + '<div class="grid2" style="gap:8px">'
      + '<div style="background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0">'
      + '<div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">In your kitchen</div>'
      + '<div style="font-family:var(--display);font-size:20px;font-weight:700">' + esc(r.haveText) + '</div>'
      + '<div style="font-size:13px;color:var(--muted)">key ingredients</div>'
      + '<div role="progressbar" aria-label="Share of key ingredients you have" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + r.havePct + '" style="height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px"><div style="height:100%;border-radius:99px;background:var(--leaf);width:' + r.havePct + '%"></div></div>'
      + '<div style="font-size:13px;font-weight:600;color:var(--ink);margin-top:4px">' + esc(r.mainLine) + '</div>'
      + '</div>'
      + '<div style="background:' + r.missBg + ';border-radius:12px;padding:10px 12px;min-width:0">'
      + '<div style="font-size:12px;font-weight:600;color:' + r.missFg + ';text-transform:uppercase;letter-spacing:.04em">Missing</div>'
      + '<div style="font-size:14px;font-weight:600;color:' + r.missFg + ';line-height:1.35;margin-top:2px;overflow-wrap:anywhere">' + esc(r.missText) + '</div>'
      + '</div></div>'
      + '<p style="margin:0;font-size:15px;color:var(--ink)"><strong>Why:</strong> ' + esc(r.why) + '</p>'
      + (r.hasTip ? '<p style="margin:0;padding:10px 12px;border-radius:12px;background:var(--leaf-soft);color:var(--leaf-ink);font-size:14px"><strong>Jain tip:</strong> ' + esc(r.tip) + '</p>' : '')
      + '<div style="display:flex;flex-wrap:wrap;gap:8px">'
      + '<button type="button"' + act(r.open) + ' style="flex:1 1 160px;min-height:48px;padding:0 18px;border-radius:999px;border:none;background:var(--ink);color:var(--card);font-weight:700;font-size:15px">See recipe</button>'
      + '<button type="button"' + act(r.skip) + ' aria-label="Not today: skip ' + esc(r.name) + '" style="flex:0 1 auto;min-height:48px;padding:0 18px;border-radius:999px;border:2px solid var(--line-strong);background:var(--card);color:var(--ink);font-weight:600;font-size:15px">Not today</button>'
      + '</div></article>';
  }

  function moreHTML(v) {
    if (!v.hasMore) return '';
    var rows = v.more.map(function (m) {

const DIETS = [
  { id: 'jain', label: 'Jain', sub: 'No root veg, no egg', mark: '#1F8A3B' },
  { id: 'veg', label: 'Vegetarian', sub: 'No egg, no meat', mark: '#1F8A3B' },
  { id: 'egg', label: 'Eggetarian', sub: 'Veg plus eggs', mark: '#C99400' },
  { id: 'nonveg', label: 'Non-veg', sub: 'Everything goes', mark: '#A0392B' }
];
const TIMES = [10, 20, 30, 45];
const GOALS = [
  { id: 'quick', label: 'Quick & easy', sub: 'Least effort' },
  { id: 'healthy', label: 'Light & healthy', sub: 'Easy on the stomach' },
  { id: 'new', label: 'Something new', sub: 'Break the routine' },
  { id: 'have', label: 'Cook with what I have', sub: 'No shopping run' }
];
const TAG_LABEL = { quick: 'Quick', healthy: 'Light', new: 'Something new' };
const GREEN = 'var(--leaf)';

function dietInfo(dish, diet) {
  if (dish.d === 'egg') return { label: 'Contains egg', mark: '#C99400' };
  if (dish.d === 'nonveg') return { label: 'Non-veg', mark: '#A0392B' };
  if (diet === 'jain') return { label: dish.roots === 'no' ? 'Jain-friendly' : 'Jain version', mark: '#1F8A3B' };
  return { label: dish.roots === 'no' ? 'Veg · Jain-friendly' : 'Veg', mark: '#1F8A3B' };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const now = Date.now();
    const today = new Date().toDateString();
    const base = { draft: '', page: 0, open: null, notice: '', addNote: '', showAll: false, toast: '', copied: '', copyFallback: '' };
    const saved = loadSaved();
    if (saved && saved.v === 1) {
      const newVisit = !saved.lastSeen || now - saved.lastSeen > VISIT_GAP_MS;
      const stats = Object.assign(freshStats(), saved.stats || {});
      if (newVisit) stats.visits += 1;
      this.state = Object.assign(base, {
        diet: saved.diet || null, time: saved.time == null ? null : saved.time, goal: saved.goal || null,
        have: saved.have || [], custom: saved.custom || [],
        log: (saved.log || []).filter((e) => now - e.at < 14 * DAY_MS),
        stats, visitId: newVisit ? now : (saved.visitId || now),
        skipped: saved.skippedDay === today ? (saved.skipped || []) : [],
        sample: !!saved.sample
      });
    } else {
      // First open: a sample kitchen so picks show up immediately
      this.state = Object.assign(base, {
        diet: 'veg', time: 20, goal: null, have: SAMPLE.slice(), custom: [],
        log: [], stats: freshStats(), visitId: now, skipped: [], sample: true
      });
    }
    this.storageOk = true;
  }

  persist() {
    const st = this.state;
    this.storageOk = writeSaved({
      v: 1, diet: st.diet, time: st.time, goal: st.goal, have: st.have, custom: st.custom,
      log: st.log, stats: st.stats, visitId: st.visitId, lastSeen: Date.now(),
      skipped: st.skipped, skippedDay: new Date().toDateString(), sample: st.sample
    });
  }

  componentDidMount() { this.persist(); this.forceUpdate(); }
  componentDidUpdate() { this.persist(); }

  recentMap() {
    const now = Date.now();
    const map = {};
    this.state.log.forEach((e) => {
      if (now - e.at < 2 * DAY_MS) map[e.n] = 'Cooked ' + whenText(daysAgo(e.at));
    });
    return map;
  }

  cookedThisVisit(name) {
    return this.state.log.some((e) => e.n === name && e.at >= this.state.visitId);
  }

  message(dish) {
    return 'Breakfast plan: ' + dish.n + ' (' + dish.t + ' min). Okay with everyone?';
  }

  cook(dish) {
    const st = this.state;
    if (this.cookedThisVisit(dish.n)) { this.setState({ toast: 'Already logged this morning. Enjoy!' }); return; }
    const now = Date.now();
    const log = st.log.filter((e) => now - e.at < 14 * DAY_MS).concat({ n: dish.n, at: now });
    const stats = Object.assign({}, st.stats, { cooked: st.stats.cooked + 1 });
    // Acceptance counts once per visit, however many times you tap
    if (stats.lastCookedVisit !== st.visitId) {
      stats.cookedVisits = stats.cookedVisits + 1;
      stats.lastCookedVisit = st.visitId;
    }
    this.setState({ log, stats, toast: 'Logged! Enjoy your ' + dish.n + '. It’ll rank lower for the next 2 days so breakfasts stay varied.' });
  }

  copy(dish) {
    const msg = this.message(dish);
    const done = () => this.setState({ copied: dish.n, copyFallback: '' });
    const fail = () => this.setState({ copied: '', copyFallback: msg });
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done, fail);
      else fail();
    } catch (e) { fail(); }
  }

  matchCustom(text) {
    const s = text.toLowerCase();
    const hits = [];
    ING.forEach((i) => {
      const hit = i.alias.some((a) => new RegExp('(^|[^a-z])' + a + '(s|es)?([^a-z]|$)').test(s) || (s.length >= 3 && a.startsWith(s)));
      if (hit) hits.push(i.id);
    });
    return hits;
  }

  haveSet() {
    const set = new Set(this.state.have);
    this.state.custom.forEach((c) => this.matchCustom(c).forEach((id) => set.add(id)));
    const forbid = this.state.diet ? FORBID[this.state.diet] : [];
    forbid.forEach((id) => set.delete(id));
    return set;
  }

  allowed(dish, diet) {
    if (diet === 'jain') return dish.d === 'veg' && dish.roots !== 'yes';
    if (diet === 'veg') return dish.d === 'veg';
    if (diet === 'egg') return dish.d !== 'nonveg';
    return true;
  }

  // Key ingredients the user would actually use (Jain drops root veg)
  keys(dish) {
    const k = dish.core.concat(dish.opt);
    return this.state.diet === 'jain' ? k.filter((id) => !ROOTS.includes(id)) : k;
  }

  analyse(dish, have) {
    const { time, goal } = this.state;
    const hasIng = have.size > 0;
    const keys = this.keys(dish);
    const haveKeys = keys.filter((id) => have.has(id));
    const missing = keys.filter((id) => !have.has(id));
    const main = dish.core[0];
    const haveMain = have.has(main);
    const limited = time !== null && time < 45;
    const fits = !limited || dish.t <= time;
    const goalMatch = goal === 'quick' ? dish.t <= 15
      : goal === 'healthy' ? dish.tags.includes('healthy')
      : goal === 'new' ? dish.tags.includes('new')
      : goal === 'have' ? missing.length === 0 : false;

    // Ranking: key ingredients you have dominate, the main ingredient is a big boost,
    // the goal nudges, and quicker dishes win ties. (Time-fit is applied as a hard tier when sorting.)
    let s = 0;
    if (hasIng) s += haveKeys.length * 12 + (haveMain ? 30 : 0) + (haveKeys.length / keys.length) * 10;
    if (goalMatch) s += hasIng ? 8 : 20;
    if (goal === 'quick') s += Math.max(0, 30 - dish.t) / 3;
    s -= dish.t / 20;
    // Cooked in the last 2 days: rank lower to keep breakfasts varied
    const recent = this.recent ? this.recent[dish.n] || '' : '';
    if (recent) s -= 60;

    let pct = hasIng
      ? 30 + 50 * (haveKeys.length / keys.length) + (haveMain ? 15 : 0) + (goalMatch ? 5 : 0)
      : 60 + (goalMatch ? 25 : 0) + (goal ? 0 : 10);
    if (!fits) pct -= 20;
    pct = Math.max(20, Math.min(99, Math.round(pct)));

    // One-line why
    let why;
    const quickBit = dish.t <= 15 ? ', ready in ' + dish.t + ' min' : '';
    if (!fits) why = 'Over your time at ' + dish.t + ' min, but nothing quicker matches';
    else if (recent) why = 'You had this ' + recent.replace('Cooked ', '') + ', so it’s ranked lower for variety';
    else if (hasIng && missing.length === 0) why = 'You have everything' + quickBit;
    else if (hasIng && missing.length === 1) why = 'Only missing ' + LABEL[missing[0]] + quickBit;
    else if (hasIng && haveMain) why = 'You have the main ingredient (' + LABEL[main] + ')' + quickBit;
    else if (hasIng) why = 'Uses your ' + listNice(haveKeys.map((id) => LABEL[id])) + ', but you’ll need ' + LABEL[main];
    else if (goal === 'quick' || dish.t <= 15) why = 'Ready in ' + dish.t + ' min';
    else if (goal === 'healthy' && dish.tags.includes('healthy')) why = 'Light and nourishing, ready in ' + dish.t + ' min';
    else if (goal === 'new' && dish.tags.includes('new')) why = 'A break from the usual poha-upma rotation';
    else if (limited) why = 'Fits your ' + time + ' min window';
    else why = 'A reliable favourite, ready in ' + dish.t + ' min';

    const missText = missing.length === 0 ? (hasIng ? 'Nothing. You’re set!' : 'Tap ingredients to check')
      : missing.map((id) => LABEL[id] + (dish.core.includes(id) ? '' : ' (optional)')).join(', ');
    const mainLine = !hasIng ? 'Main: ' + LABEL[main] : haveMain ? 'Main (' + LABEL[main] + '): you have it' : 'Main (' + LABEL[main] + '): missing';
    return { s, pct, why, fits, recent, haveCount: haveKeys.length, keyCount: keys.length, missing, missText, hasIng, haveMain, mainLine };
  }

  pickDiet(id) {
    const st = this.state;
    const forbid = FORBID[id];
    const dropped = st.have.filter((x) => forbid.includes(x)).map((x) => LABEL[x]);
    const keepCustom = st.custom.filter((c) => !this.matchCustom(c).some((h) => forbid.includes(h)));
    const droppedCustom = st.custom.filter((c) => !keepCustom.includes(c));
    const names = dropped.concat(droppedCustom);
    const dl = DIETS.find((d) => d.id === id).label;
    const notice = names.length
      ? 'Removed ' + listNice(names) + ' from your kitchen — not part of ' + dl + ' meals.'
      : '';
    this.set({ diet: id, have: st.have.filter((x) => !forbid.includes(x)), custom: keepCustom, notice, addNote: '' });
  }

  set(patch) { this.setState(Object.assign({ page: 0, sample: false }, patch)); }

  skip(name) {
    const st = this.state;
    if (st.skipped.includes(name)) return;
    const stats = Object.assign({}, st.stats, { skipped: st.stats.skipped + 1 });
    this.setState({ skipped: st.skipped.concat(name), stats, open: null, toast: '', copied: '', copyFallback: '' });
  }

  addDraft() {
    const st = this.state;
    const v = st.draft.trim().replace(/\s+/g, ' ');
    if (!v) return;
    const low = v.toLowerCase();
    const forbid = st.diet ? FORBID[st.diet] : [];
    const exact = ING.find((i) => i.label.toLowerCase() === low || i.alias.includes(low));
    const hits = exact ? [exact.id] : this.matchCustom(low);
    if (hits.some((h) => forbid.includes(h))) {
      const dl = DIETS.find((d) => d.id === st.diet).label;
      this.setState({ draft: '', addNote: '“' + v + '” isn’t part of ' + dl + ' meals, so I left it out.' });
      return;
    }
    if (exact) {
      const have = st.have.includes(exact.id) ? st.have : st.have.concat(exact.id);
      this.set({ have, draft: '', addNote: 'Selected ' + exact.label + ' in the list.' });
      return;
    }
    if (st.custom.some((c) => c.toLowerCase() === low)) { this.setState({ draft: '', addNote: '' }); return; }
    this.set({ custom: st.custom.concat(v), draft: '',
      addNote: hits.length ? '' : 'Added. None of our dishes use ' + v + ' yet, so it won’t change the suggestions.' });
  }

  buildSheet(dish, have) {
    const diet = this.state.diet;
    const a = this.analyse(dish, have);
    const known = new Set(ING.map((i) => i.id));
    // Jain: root vegetables (and ginger/garlic) are simply left out of the list
    const rows = diet === 'jain' ? dish.r.ing.filter(([id]) => !ROOTS.includes(id)) : dish.r.ing;
    const ing = rows.map(([id, text]) => {
      if (id && diet === 'jain' && ROOTS.includes(id)) return { text, status: 'Skip for Jain', sBg: 'var(--soft2)', sFg: 'var(--muted)', textColor: 'var(--muted)', strike: 'line-through' };
      if (!id || !known.has(id)) return { text, status: 'Pantry', sBg: 'var(--bg)', sFg: 'var(--muted)', textColor: 'var(--ink)', strike: 'none' };
      if (have.has(id)) return { text, status: 'In kitchen', sBg: 'var(--leaf-soft)', sFg: 'var(--leaf-ink)', textColor: 'var(--ink)', strike: 'none' };
      const optional = !dish.core.includes(id);
      return { text, status: optional ? 'Missing · optional' : 'Missing', sBg: 'var(--chili-soft)', sFg: 'var(--chili-ink)', textColor: 'var(--ink)', strike: 'none' };
    });
    return {
      name: dish.n, time: dish.t, serves: dish.r.serves, dietLabel: dietInfo(dish, diet).label,
      haveText: a.haveCount + '/' + a.keyCount,
      ing, steps: dish.r.steps.map((text, i) => ({ n: i + 1, text: diet === 'jain' ? text.replace(/,? (and )?ginger(-garlic paste)?/g, '') : text })), tip: dish.r.tip,
      hasJain: diet === 'jain' && dish.roots === 'adapt' && !!dish.tip, jainTip: dish.tip,
      skip: () => this.skip(dish.n),
      cook: () => this.cook(dish),
      cookLabel: this.cookedThisVisit(dish.n) ? 'Cooking this ✓' : 'I’m cooking this',
      copy: () => this.copy(dish),
      copyLabel: this.state.copied === dish.n ? 'Copied ✓ Paste in WhatsApp' : 'Copy message for family',
      waHref: 'https://wa.me/?text=' + encodeURIComponent(this.message(dish))
    };
  }

  greet() {
    const now = new Date();
    const h = now.getHours();
    const day = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][now.getDay()];
    const evening = h >= 17 || h < 4;
    const part = h >= 4 && h < 12 ? 'Good morning' : h >= 12 && h < 17 ? 'Good afternoon' : 'Good evening';
    return {
      greeting: part + ' · ' + day + (evening ? ' · planning tomorrow?' : ''),
      tagline: evening ? 'Pick tomorrow’s breakfast tonight and skip the morning debate.' : 'Four quick taps. Three breakfasts you can actually make today.',
      resultsTitle: evening ? 'Tomorrow’s top 3' : 'Your top 3',
      ctaText: evening ? 'See tomorrow’s picks' : 'See my top 3'
    };
  }

  renderVals() {
    const st = this.state;
    this.recent = this.recentMap();
    const hello = this.greet();
    const sel = (on) => ({ bg: on ? 'var(--leaf-soft)' : 'var(--card)', bd: on ? GREEN : 'var(--line)' });

    const dietOpts = DIETS.map((d) => Object.assign({}, d, sel(st.diet === d.id), {
      on: st.diet === d.id, pick: () => this.pickDiet(d.id)
    }));
    const timeOpts = TIMES.map((t) => {
      const on = st.time === t;
      return { label: t === 45 ? '45+' : String(t), on, bg: on ? GREEN : 'var(--card)', fg: on ? 'var(--card)' : 'var(--ink)', bd: on ? GREEN : 'var(--line)',
        pick: () => this.set({ time: on ? null : t }) };
    });
    const goalOpts = GOALS.map((g) => Object.assign({}, g, sel(st.goal === g.id), {
      on: st.goal === g.id, pick: () => this.set({ goal: st.goal === g.id ? null : g.id })
    }));
    const forbid = st.diet ? FORBID[st.diet] : [];
    const chip = (i) => {
      const on = st.have.includes(i.id);
      return { label: i.label, on, bg: on ? GREEN : 'var(--card)', fg: on ? 'var(--card)' : 'var(--ink)', bd: on ? GREEN : 'var(--line-strong)',
        pick: () => this.set({ have: on ? st.have.filter((x) => x !== i.id) : st.have.concat(i.id), addNote: '' }) };
    };
    const groups = GROUPS.map((g) => ({
      label: g.label,
      chips: ING.filter((i) => i.g === g.id && !forbid.includes(i.id)).map(chip)
    })).filter((g) => g.chips.length > 0);
    const customChips = st.custom.map((c) => ({ label: c, remove: () => this.set({ custom: st.custom.filter((x) => x !== c) }) }));

    const have = this.haveSet();
    let results = [];
    let pageNote = '';
    let emptyMsg = '';
    let hasMore = false;
    let more = [];
    let moreNote = '';
    let canShowAll = false;
    let showAllText = '';
    let matchCount = 0;
    let unlocks = [];
    if (st.diet) {
      const hasIng = have.size > 0;
      let pool = DISHES.filter((d) => this.allowed(d, st.diet) && !st.skipped.includes(d.n))
        .map((d) => ({ dish: d, a: this.analyse(d, have) }));
      // Hide dishes that use none of what you picked
      if (hasIng) pool = pool.filter((x) => x.a.haveCount > 0);
      // Cook with what I have: at most one key item missing
      if (st.goal === 'have') pool = hasIng ? pool.filter((x) => x.a.haveMain && x.a.missing.length <= 1) : [];
      // Dishes within your time always come first; longer ones only after them
      pool.sort((x, y) => (Number(y.a.fits) - Number(x.a.fits)) || (y.a.s - x.a.s) || (x.dish.t - y.dish.t));
      const ranked = pool;
      const p = 0;
      matchCount = ranked.length;
      hasMore = ranked.length > 3;
      const pctOf = (a) => (a.keyCount ? Math.round((a.haveCount / a.keyCount) * 100) : 0);

      // More options: everything after the top 3
      const rest = ranked.slice(3);
      const limit = st.showAll ? rest.length : 6;
      more = rest.slice(0, limit).map((x) => {
        const a = x.a;
        return {
          name: x.dish.n, over: !a.fits, havePct: pctOf(a),
          meta: x.dish.t + ' min · ' + dietInfo(x.dish, st.diet).label + ' · '
            + (a.hasIng ? a.haveCount + '/' + a.keyCount + ' in kitchen' : a.keyCount + ' key ingredients')
            + (a.recent ? ' · ' + a.recent : ''),
          open: () => this.setState({ open: x.dish.n }),
          skip: () => this.skip(x.dish.n)
        };
      });
      canShowAll = rest.length > 6;
      showAllText = st.showAll ? 'Show fewer' : 'Show all ' + rest.length;
      moreNote = rest.length + (rest.length === 1 ? ' more dish' : ' more dishes');

      // Add one item to unlock: dishes that become makeable (at most one key item missing)
      if (hasIng) {
        const base = DISHES.filter((d) => this.allowed(d, st.diet) && !st.skipped.includes(d.n));
        const ready = (d, set) => { const a = this.analyse(d, set); return a.haveMain && a.missing.length <= 1; };
        const readyNow = new Set(base.filter((d) => ready(d, have)).map((d) => d.n));
        unlocks = ING.filter((i) => !forbid.includes(i.id) && !have.has(i.id)).map((i) => {
          const set = new Set(have);
          set.add(i.id);
          const n = base.filter((d) => !readyNow.has(d.n) && ready(d, set)).length;
          return { id: i.id, label: i.label, n };
        }).filter((u) => u.n > 0)
          .sort((x, y) => y.n - x.n)
          .slice(0, 3)
          .map((u) => ({
            label: u.label, countText: u.n + (u.n === 1 ? ' dish' : ' dishes'),
            add: () => this.set({ have: st.have.concat(u.id), addNote: '' })
          }));
      }
      const overCount = ranked.filter((x) => !x.a.fits).length;
      if (!ranked.length) {
        if (st.goal === 'have' && !hasIng) emptyMsg = 'Tap what’s in your kitchen and I’ll show dishes you can make with at most one item missing.';
        else if (st.goal === 'have') emptyMsg = 'Nothing is within one item of what you have. Add a few more ingredients, or pick another goal.';
        else if (hasIng && st.skipped.length === 0) emptyMsg = 'None of our dishes use what you’ve picked. Add a staple like poha, rava, atta or bread.';
        else emptyMsg = 'You’ve skipped everything that matches. Bring some back below.';
      }
      const rankBgs = ['var(--turmeric)', 'var(--rank2)', 'var(--rank3)'];
      results = ranked.slice(p * 3, p * 3 + 3).map((x, i) => {
        const d = x.dish;
        const a = x.a;
        const di = dietInfo(d, st.diet);
        const noneMissing = a.hasIng && a.missing.length === 0;
        return {
          rank: p * 3 + i + 1, rankBg: rankBgs[i], name: d.n, desc: d.desc, time: d.t,
          pct: a.pct, over: !a.fits, mainLine: a.mainLine, havePct: pctOf(a),
          isRecent: !!a.recent, recentLabel: a.recent,
          dietLabel: di.label, mark: di.mark,
          tags: d.tags.map((t) => TAG_LABEL[t]),
          haveText: a.haveCount + '/' + a.keyCount,
          missText: a.missText,
          missBg: noneMissing ? 'var(--leaf-soft)' : (a.hasIng ? 'var(--chili-soft)' : 'var(--bg)'),
          missFg: noneMissing ? 'var(--leaf-ink)' : (a.hasIng ? 'var(--chili-ink)' : 'var(--muted)'),
          why: a.why,
          hasTip: st.diet === 'jain' && d.roots === 'adapt' && !!d.tip, tip: d.tip,
          open: () => this.setState({ open: d.n }),
          skip: () => this.skip(d.n)
        };
      });
      pageNote = ranked.length
        ? 'Showing ' + (p * 3 + 1) + '–' + (p * 3 + results.length) + ' of ' + ranked.length + (ranked.length === 1 ? ' match' : ' matches')
          + (overCount ? ' · ' + overCount + ' over your time' : '')
        : '';
    }

    const haveCount = st.have.length + st.custom.length;
    const parts = [];
    if (st.diet) {
      parts.push(DIETS.find((d) => d.id === st.diet).label);
      parts.push(haveCount ? haveCount + (haveCount === 1 ? ' ingredient' : ' ingredients') + ' selected' : 'No ingredients selected');
      parts.push(matchCount + (matchCount === 1 ? ' dish matches' : ' dishes match'));
    }

    const openDish = st.open ? DISHES.find((d) => d.n === st.open) : null;
    const emptySheet = { name: '', time: 0, serves: 0, dietLabel: '', haveText: '', ing: [], steps: [], tip: '', hasJain: false, jainTip: '',
      skip: () => {}, cook: () => {}, cookLabel: '', copy: () => {}, copyLabel: '', waHref: '#' };

    // Your mornings so far
    const sx = st.stats;
    const rate = sx.visits > 0 ? Math.round((sx.cookedVisits / sx.visits) * 100) : 0;
    const last = st.log.length ? st.log[st.log.length - 1] : null;

    return {
      dietOpts, timeOpts, goalOpts, groups, customChips, results, pageNote,
      hasCustom: st.custom.length > 0,
      greeting: hello.greeting, tagline: hello.tagline, resultsTitle: hello.resultsTitle, ctaText: hello.ctaText,
      kitchenNote: st.diet === 'jain'
        ? 'Root vegetables like onion, potato and carrot are hidden for Jain. Tap the staples you have, or skip this and we’ll suggest anything that fits.'
        : 'Tap everything you have. Skip this and we’ll suggest anything that fits.',
      notice: st.notice, hasNotice: !!st.notice, dismissNotice: () => this.setState({ notice: '' }),
      addNote: st.addNote, hasAddNote: !!st.addNote,
      emptyMsg, showEmpty: !!st.diet && !!emptyMsg, hasMore,
      more, moreNote, canShowAll, showAllText, toggleAll: () => this.setState({ showAll: !st.showAll }),
      unlocks, hasUnlocks: unlocks.length > 0,
      sample: !!st.sample,
      clearSample: () => this.set({ have: [], custom: [], sample: false }),
      hasToast: !!st.toast, toast: st.toast,
      hasCopyFallback: !!st.copyFallback, copyFallback: st.copyFallback,
      statCooked: sx.cooked, statRate: rate + '%', statSkipped: sx.skipped,
      statsNote: (this.storageOk ? 'Saved in this browser' : 'Not saved: this browser is blocking storage') + ' · ' + sx.visits + (sx.visits === 1 ? ' visit' : ' visits'),
      lastCooked: last ? 'Last cooked: ' + last.n + ', ' + whenText(daysAgo(last.at)) : 'Tap “I’m cooking this” in a recipe to start your log.',
      resetStats: () => this.setState({ stats: freshStats(), log: [] }),
      needDiet: !st.diet, showResults: !!st.diet,
      summary: parts.join(' · '),
      hasAnyIng: haveCount > 0, haveCount,
      clearIng: () => this.set({ have: [], custom: [] }),
      draft: st.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onDraftKey: (e) => { if (e.key === 'Enter') { e.preventDefault(); this.addDraft(); } },
      addDraft: () => this.addDraft(),
      next: () => this.setState({ page: st.page + 1 }),
      hasSkipped: st.skipped.length > 0,
      skippedText: st.skipped.join(', '),
      undoSkip: () => this.set({ skipped: [] }),
      sheetOpen: !!openDish,
      sheet: openDish ? this.buildSheet(openDish, have) : emptySheet,
      closeSheet: () => this.setState({ open: null, toast: '', copied: '', copyFallback: '' })
    };
  }
}

window.__startBreakfastBuddy(Component);
</script>
